<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#fbeaf0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Bloom" />
<meta name="format-detection" content="telephone=no" />
<title>Bloom</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<style>
/* ================= Farben (Rosé als Standard) ================= */
:root{
  --bg1:#fbeaf0; --bg2:#f1e9fb; --bg3:#e9f0fb;
  --card:#ffffff;
  --card-2:#f7f2f8;
  --ink:#3a2f42;
  --soft:#857a8e;
  --faint:#c0b5c8;
  --accent:#e0779e;
  --accent-2:#a886de;
  --accent-ink:#c4527c;
  --accent-soft:rgba(224,119,158,.14);
  --sep:rgba(70,40,90,.08);
  --track:rgba(90,60,110,.08);
  --seg-on:#ffffff;
  --shadow:0 1px 2px rgba(60,30,80,.04), 0 10px 28px -14px rgba(120,70,150,.28);
  --done:#b3a8bd;
  --danger:#df3f4b;
  --bubble-done:#ece7f0;
  --rail:rgba(168,134,222,.38);
  --overlay:rgba(40,25,50,.32);
  --check-ring:#e6d6e7;
}
html.theme-lavender{--bg1:#efe8fb;--bg2:#ece6fb;--bg3:#f4e8fa;--accent:#9b7fe0;--accent-2:#e083c0;--accent-ink:#7b5ccc;--accent-soft:rgba(155,127,224,.15);--check-ring:#ddd2f2;--rail:rgba(155,127,224,.38);}
html.theme-peach{--bg1:#fdece2;--bg2:#fbe7ec;--bg3:#fdf2e8;--accent:#ee9466;--accent-2:#e27f9f;--accent-ink:#c2602f;--accent-soft:rgba(238,148,102,.15);--check-ring:#f3dccd;--rail:rgba(238,148,102,.4);}
html.theme-mint{--bg1:#e2f4ec;--bg2:#e7f4f1;--bg3:#e2eff5;--accent:#4fbf98;--accent-2:#6fb6dd;--accent-ink:#278866;--accent-soft:rgba(79,191,152,.16);--check-ring:#cfe9de;--rail:rgba(79,191,152,.4);}
html.theme-dark{
  --bg1:#0c0d12;--bg2:#11131b;--bg3:#0d1016;
  --card:#171a23;--card-2:#20242f;
  --ink:#eceef5;--soft:#969cb0;--faint:#565d71;
  --accent:#6ea8ff;--accent-2:#9b7bff;--accent-ink:#93bcff;--accent-soft:rgba(110,168,255,.16);
  --sep:rgba(255,255,255,.07);--track:rgba(255,255,255,.07);--seg-on:#2b3040;
  --shadow:0 10px 28px -14px rgba(0,0,0,.75);
  --done:#5b6276;--bubble-done:#262a36;--rail:rgba(155,123,255,.38);
  --overlay:rgba(0,0,0,.55);--check-ring:#3a4152;
}

/* ================= Grundlayout ================= */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg1);-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{
  min-height:100vh;min-height:100dvh;
  color:var(--ink);background:var(--bg1);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.4;
  display:flex;justify-content:center;
  overscroll-behavior-y:none;
  touch-action:manipulation;
}
/* ruhiger, fester Farbverlauf im Hintergrund */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 60% at 0% 0%, var(--bg1) 0%, transparent 70%),
    radial-gradient(100% 60% at 100% 100%, var(--bg3) 0%, transparent 70%),
    linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
}
button{font-family:inherit;color:inherit;cursor:pointer;}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

#app{
  position:relative;z-index:1;width:100%;max-width:480px;
  padding:calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 108px);
  display:flex;flex-direction:column;gap:14px;
}
/* helle Farbwelten im installierten Vollbild-Modus: Uhr/Akku oben lesbar halten */
.topbar{
  display:none;position:fixed;top:0;left:0;right:0;z-index:40;pointer-events:none;
  height:env(safe-area-inset-top, 0px);
  background:rgba(58,47,66,.26);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}

/* ================= Kopfbereich ================= */
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:4px 2px 2px;}
.hello{font-size:14px;font-weight:600;color:var(--soft);}
.title{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.12;margin-top:2px;text-wrap:balance;}
.title b{background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.quote{font-size:14px;color:var(--soft);margin-top:6px;max-width:34ch;}
.icon-btn{
  width:40px;height:40px;flex:none;border-radius:50%;border:0;
  background:var(--card);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;color:var(--ink);
}
.icon-btn svg{width:20px;height:20px;}
.icon-btn:active{transform:scale(.92);}

/* iOS-Segmentschalter */
.segmented{display:flex;background:var(--track);border-radius:11px;padding:3px;}
.seg{
  flex:1;border:0;background:transparent;color:var(--soft);
  font-size:14px;font-weight:600;padding:8px 0;border-radius:8px;transition:background .2s,color .2s;
}
.seg.active{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08),0 3px 10px -4px rgba(0,0,0,.12);}

/* ================= Karten & Abschnitte ================= */
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 4px 0;}
.section-head h2{font-size:20px;font-weight:800;letter-spacing:-.3px;}
.section-head .count{font-size:14px;font-weight:600;color:var(--soft);margin-left:6px;}
.only-desktop{display:none!important;}
.add-inline{
  border:0;background:var(--accent-soft);color:var(--accent-ink);
  font-size:14px;font-weight:700;padding:8px 13px;border-radius:999px;
}
.sub-head{font-size:13px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.5px;padding:8px 6px 0;}

/* Tagesübersicht */
.summary{display:flex;align-items:center;gap:16px;padding:16px;}
.ring{position:relative;width:64px;height:64px;flex:none;}
.ring svg{display:block;transform:rotate(-90deg);}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;}
.sum-text{flex:1;min-width:0;}
.sum-big{font-size:17px;font-weight:700;}
.sum-small{font-size:14px;color:var(--soft);margin-top:1px;}
#grad stop:first-child{stop-color:var(--accent);}
#grad stop:last-child{stop-color:var(--accent-2);}

/* ================= Aufgabenliste (iOS-Gruppenliste) ================= */
.group{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;}
.task{
  position:relative;display:flex;align-items:center;gap:10px;
  padding:12px 6px 12px 14px;min-height:56px;background:var(--card);
  transition:opacity .22s, transform .22s;
}
.task + .task::before{content:"";position:absolute;top:0;left:52px;right:0;height:1px;background:var(--sep);}
.task.removing{opacity:0;transform:translateX(24px);}
.check{
  position:relative;width:26px;height:26px;flex:none;border-radius:50%;
  border:2px solid var(--check-ring);background:transparent;padding:0;
  display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s;
}
.check::after{content:"";position:absolute;inset:-10px;} /* größere Tippfläche */
.check svg{width:14px;height:14px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s ease .05s;}
.task.done .check{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;}
.task.done .check svg{stroke-dashoffset:0;}
.ticon{font-size:19px;width:24px;text-align:center;flex:none;}
.task.done .ticon{opacity:.45;filter:grayscale(.5);}
.tbody{flex:1;min-width:0;cursor:pointer;padding:2px 0;}
.tlabel{font-size:16px;font-weight:500;line-height:1.3;word-break:break-word;}
.task.done .tlabel{color:var(--done);text-decoration:line-through;}
.tnote{font-size:13px;color:var(--soft);line-height:1.3;margin-top:2px;word-break:break-word;}
.task.done .tnote{color:var(--faint);}
.tmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
.mchip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;}
.mchip.prio{color:var(--accent-ink);background:var(--accent-soft);}
.mchip.when{color:var(--soft);background:var(--track);}
.tbtn{
  width:36px;height:40px;flex:none;border:0;background:transparent;color:var(--faint);
  display:flex;align-items:center;justify-content:center;border-radius:10px;
}
.tbtn svg{width:16px;height:16px;}
.tbtn.drag{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;}
.tbtn:active{color:var(--accent-ink);}
.task.dragging{z-index:5;box-shadow:0 14px 34px -12px rgba(80,50,110,.45);border-radius:14px;transform:scale(1.02);}
.empty{text-align:center;color:var(--soft);padding:30px 22px;font-size:15px;}
.empty .em{display:block;font-size:30px;margin-bottom:8px;}
.text-btn{border:0;background:none;color:var(--accent-ink);font-size:14px;font-weight:600;padding:8px 6px;}

/* ================= Planer ================= */
.cal-head{display:flex;align-items:center;gap:8px;}
.cal-label{flex:1;text-align:center;font-size:15px;font-weight:700;}
.nav-btn{
  width:36px;height:36px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;color:var(--ink);
}
.nav-btn svg{width:16px;height:16px;}
.today-btn{border:0;background:var(--accent-soft);color:var(--accent-ink);font-size:13px;font-weight:700;padding:7px 11px;border-radius:999px;}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.day{
  border:0;background:transparent;border-radius:14px;padding:8px 0 7px;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink);
}
.day .wd{font-size:11px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.3px;}
.day .num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;}
.day .dot{width:5px;height:5px;border-radius:50%;background:transparent;}
.day.has .dot{background:var(--accent);}
.day.today .num{color:var(--accent-ink);}
.day.sel .num{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;}
.day-title{font-size:15px;font-weight:700;color:var(--soft);padding:0 4px;}

.panel{padding:8px 10px 10px 4px;}
.tlx-row{display:flex;align-items:stretch;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.tlx-row.dragging{z-index:5;background:var(--card);border-radius:16px;box-shadow:0 16px 36px -12px rgba(60,40,90,.5);}
.tlx-time{
  width:48px;flex:none;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;
  padding:15px 6px 14px 0;font-variant-numeric:tabular-nums;
}
.tlx-time .t1{font-size:13px;font-weight:700;}
.tlx-time .t2{font-size:12px;font-weight:500;color:var(--soft);}
.tlx-rail{width:48px;flex:none;position:relative;display:flex;flex-direction:column;align-items:center;padding:7px 0;}
.tlx-rail::before,.tlx-gap .rail::before{content:"";position:absolute;top:0;bottom:0;left:50%;margin-left:-1px;border-left:2px dashed var(--rail);}
.tlx-bubble{
  position:relative;z-index:1;width:40px;min-height:40px;border-radius:20px;
  background:linear-gradient(160deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;font-size:18px;
  box-shadow:0 6px 14px -6px rgba(150,90,170,.6);
}
.tlx-bubble.pill{flex:1;align-items:flex-start;padding-top:9px;}
.tlx-row.routine .tlx-bubble{background:var(--card-2);box-shadow:none;}
.tlx-row.done .tlx-bubble{background:var(--bubble-done);box-shadow:none;filter:grayscale(.4);opacity:.8;}
.tlx-body{flex:1;min-width:0;display:flex;align-items:flex-start;gap:6px;padding:10px 0 14px 8px;}
.tlx-info{flex:1;min-width:0;cursor:pointer;}
.tlx-sub{font-size:13px;font-weight:600;color:var(--soft);font-variant-numeric:tabular-nums;}
.tlx-sub.now{color:var(--accent-ink);}
.tlx-title{font-size:16px;font-weight:700;line-height:1.3;word-break:break-word;}
.tlx-row.done .tlx-title{color:var(--done);text-decoration:line-through;}
.tlx-note{font-size:13px;color:var(--soft);margin-top:1px;word-break:break-word;}
.tlx-body .check{margin-top:9px;margin-right:6px;}
.tlx-row.done .check{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;}
.tlx-row.done .check svg{stroke-dashoffset:0;}
.tlx-gap{display:flex;align-items:center;min-height:36px;}
.tlx-gap .sp{width:48px;flex:none;}
.tlx-gap .rail{width:48px;flex:none;align-self:stretch;position:relative;}
.tlx-gap .msg{flex:1;padding-left:8px;font-size:13px;color:var(--soft);}
.tlx-gap .msg b{color:var(--accent-ink);font-weight:700;}
.tlx-now{display:flex;align-items:center;padding:2px 0;}
.tlx-now .t{width:48px;flex:none;text-align:right;padding-right:6px;font-size:12px;font-weight:800;color:var(--accent-ink);font-variant-numeric:tabular-nums;}
.tlx-now .ln{flex:1;height:2px;border-radius:2px;background:var(--accent);opacity:.6;position:relative;}
.tlx-now .ln::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent);}
.hint{font-size:12px;color:var(--faint);text-align:center;padding:4px 0 0;}

/* ================= Plus-Knopf ================= */
.fab{
  position:fixed;z-index:10;right:20px;bottom:calc(env(safe-area-inset-bottom, 0px) + 20px);
  width:58px;height:58px;border-radius:50%;border:0;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 12px 26px -8px rgba(140,80,160,.6);
  display:flex;align-items:center;justify-content:center;
}
.fab svg{width:26px;height:26px;}
.fab:active{transform:scale(.92);}

/* ================= Sheets ================= */
.overlay{position:fixed;inset:0;z-index:20;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .25s;}
.overlay.open{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;z-index:21;left:50%;bottom:0;width:100%;max-width:520px;
  transform:translate(-50%,104%);
  background:var(--card);border-radius:22px 22px 0 0;
  max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;
  box-shadow:0 -10px 40px -20px rgba(60,30,80,.5);
  visibility:hidden;
  transition:transform .34s cubic-bezier(.32,.9,.3,1), visibility 0s linear .34s;
}
.sheet.open{transform:translate(-50%,0);visibility:visible;transition:transform .34s cubic-bezier(.32,.9,.3,1), visibility 0s;}
.grab{width:36px;height:5px;border-radius:3px;background:var(--faint);opacity:.6;margin:8px auto 0;flex:none;}
.sheet-bar{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  padding:6px 8px 10px;border-bottom:1px solid var(--sep);flex:none;
}
.sheet-bar h3{font-size:16px;font-weight:700;text-align:center;}
.bar-btn{border:0;background:none;font-size:16px;color:var(--accent-ink);padding:8px;justify-self:start;}
.bar-btn.right{justify-self:end;font-weight:700;}
.sheet-body{
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:14px 16px calc(env(safe-area-inset-bottom, 0px) + 22px);
}
.input{
  width:100%;border:0;border-radius:12px;background:var(--card-2);color:var(--ink);
  font-family:inherit;font-size:17px;padding:13px 14px;outline:none;-webkit-appearance:none;appearance:none;
}
.input::placeholder{color:var(--faint);}
.input.big{font-size:18px;font-weight:600;}
.input + .input{margin-top:8px;}
.shake{animation:shake .32s;}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.label{font-size:13px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.5px;margin:18px 4px 8px;}
.icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;}
.icon-chip{aspect-ratio:1;border:0;border-radius:11px;background:var(--card-2);font-size:19px;padding:0;display:flex;align-items:center;justify-content:center;}
.icon-chip.active{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent);}
.when-row{display:flex;gap:8px;align-items:stretch;}
.when-row .input{flex:1;min-width:0;min-height:48px;}
.pill-toggle{
  flex:none;border:0;border-radius:12px;background:var(--card-2);color:var(--soft);
  font-size:15px;font-weight:600;padding:0 14px;min-height:48px;
}
.pill-toggle.active{background:var(--accent-soft);color:var(--accent-ink);}
.wheels{display:flex;gap:8px;margin-top:10px;transition:opacity .2s;}
.wheels.disabled{opacity:.35;pointer-events:none;}
.wheel-group{flex:1;min-width:0;}
.wheel-cap{font-size:12px;font-weight:600;color:var(--soft);text-align:center;margin-bottom:5px;}
.wheel-wrap{position:relative;border-radius:12px;background:var(--card-2);}
.wheel-wrap::after{
  content:"";position:absolute;left:5px;right:5px;top:40px;height:40px;border-radius:9px;
  background:var(--accent-soft);pointer-events:none;
}
.wheel{
  position:relative;z-index:1;height:120px;overflow-y:auto;
  scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain;
}
.wheel::-webkit-scrollbar{display:none;}
.wheel .pad{height:40px;}
.witem{height:40px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;
  font-size:17px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums;}
.witem.on{color:var(--accent-ink);font-weight:800;}
.btn-danger{
  width:100%;margin-top:22px;border:0;border-radius:12px;background:rgba(223,63,75,.1);color:var(--danger);
  font-size:16px;font-weight:600;padding:14px 0;
}

/* Einstellungen */
.mgroup{background:var(--card-2);border-radius:14px;overflow:hidden;}
.mgroup + .label{margin-top:22px;}
.mrow{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:50px;
  padding:10px 14px;border:0;background:transparent;text-align:left;font-size:16px;color:var(--ink);
}
.mrow + .mrow::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--sep);}
.mrow .m-ico{width:22px;text-align:center;flex:none;}
.mrow .m-txt{flex:1;}
.mrow .m-hint{font-size:14px;color:var(--soft);}
.mrow input{flex:1;min-width:0;border:0;background:transparent;font-family:inherit;font-size:16px;color:var(--ink);text-align:right;outline:none;}
.mrow input::placeholder{color:var(--faint);}
.swatches{display:flex;gap:12px;padding:14px;flex-wrap:wrap;}
.swatch{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;font-size:12px;font-weight:600;color:var(--soft);}
.swatch i{width:40px;height:40px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);}
.swatch.active i{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--accent);}
.swatch.active{color:var(--ink);}
.switch{width:51px;height:31px;flex:none;border-radius:16px;border:0;background:var(--track);position:relative;transition:background .2s;padding:0;}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .2s;}
.switch[aria-checked="true"]{background:var(--accent);}
.switch[aria-checked="true"]::after{transform:translateX(20px);}
.version{text-align:center;font-size:12px;color:var(--faint);padding-top:18px;}

/* ================= Toast & Konfetti ================= */
.toast{
  position:fixed;z-index:60;left:50%;bottom:calc(env(safe-area-inset-bottom, 0px) + 92px);
  transform:translate(-50%,14px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);
  background:var(--ink);color:var(--card);font-size:15px;font-weight:600;
  padding:12px 16px;border-radius:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);
  transition:opacity .25s, transform .3s cubic-bezier(.2,1.2,.4,1);white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast .act{border:0;background:none;color:var(--accent);font-size:15px;font-weight:700;padding:0;display:none;}
.toast.show .act.on{display:inline;pointer-events:auto;}
html.theme-dark .toast .act{color:#2f6fe0;}
.confetti{position:fixed;z-index:50;pointer-events:none;width:9px;height:9px;border-radius:2px;}

/* ================= Laptop / PC: zwei Spalten ================= */
@media (min-width:960px){
  #app{
    max-width:1120px;padding:32px 32px 48px;
    display:grid;grid-template-columns:400px minmax(0,1fr);column-gap:32px;row-gap:16px;align-items:start;align-content:start;
  }
  .header{grid-column:1/-1;}
  .segmented,.fab{display:none!important;}
  #listView,#calView{display:flex!important;flex-direction:column;gap:14px;min-width:0;}
  .only-desktop{display:inline-flex!important;}
  .sheet{
    bottom:auto;top:50%;border-radius:22px;max-height:88vh;
    transform:translate(-50%,-47%) scale(.97);opacity:0;pointer-events:none;
    transition:transform .2s ease, opacity .2s ease, visibility 0s linear .2s;
  }
  .sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto;transition:transform .2s ease, opacity .2s ease, visibility 0s;}
  .grab{display:none;}
  .tbody:hover .tlabel,.tlx-info:hover .tlx-title{color:var(--accent-ink);}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

<script>
"use strict";

/* ================= Sound (Web Audio, keine externen Dateien) =================
   Kurze, weiche UI-Klänge: gläserne Töne mit Obertönen, ein leiser Klick als
   „haptischer" Anschlag und etwas Raumhall. Alles läuft über einen Kompressor,
   damit nichts übersteuert. */
const Sound = (() => {
  let ctx = null, bus = null, verb = null, noise = null;

  function ensure(){
    if(!ctx){
      // iPhone: Musik/Podcasts laufen weiter, und der Lautlos-Schalter wird respektiert
      try{ if(navigator.audioSession) navigator.audioSession.type = 'ambient'; }catch(e){}
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 12; comp.ratio.value = 4;
      comp.attack.value = .002; comp.release.value = .12;
      bus = ctx.createGain(); bus.gain.value = .6;
      const air = ctx.createBiquadFilter(); air.type = 'highshelf'; air.frequency.value = 6000; air.gain.value = -6;
      bus.connect(air); air.connect(comp); comp.connect(ctx.destination);

      verb = ctx.createConvolver(); verb.buffer = impulse(1.2, 3.2);
      const wet = ctx.createGain(); wet.gain.value = .22;
      verb.connect(wet); wet.connect(comp);

      noise = ctx.createBuffer(1, Math.floor(ctx.sampleRate * .25), ctx.sampleRate);
      const d = noise.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
    }
    if(ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function impulse(sec, decay){
    const len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, len, ctx.sampleRate);
    for(let ch=0; ch<2; ch++){
      const d = b.getChannelData(ch);
      for(let i=0;i<len;i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, decay);
    }
    return b;
  }
  /* Hüllkurve: sehr schneller Anschlag, natürliches Ausklingen */
  function env(g, t, peak, attack, dur){
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function route(node, send){
    node.connect(bus);
    if(send){ const s = ctx.createGain(); s.gain.value = send; node.connect(s); s.connect(verb); }
  }
  /* Gläserner Ton: Grundton + leiser, schnell abklingender Oberton */
  function bell(freq, at, dur, gain, send){
    const t = ctx.currentTime + at;
    [[1, 1, dur], [2.76, .22, dur*.45], [5.4, .06, dur*.25]].forEach(([mul, lvl, d]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(freq*mul, t);
      env(g, t, gain*lvl, .004, d);
      o.connect(g); route(g, send);
      o.start(t); o.stop(t + d + .05);
    });
  }
  /* Weicher Ton mit Tonhöhen-Gleiten (Blubb/Plopp) */
  function glide(f1, f2, at, dur, gain, send){
    const t = ctx.currentTime + at;
    const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.type = 'sine';
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + dur*.6);
    lp.type = 'lowpass'; lp.frequency.value = 2400;
    env(g, t, gain, .006, dur);
    o.connect(lp); lp.connect(g); route(g, send);
    o.start(t); o.stop(t + dur + .05);
  }
  /* Kurzer gefilterter Klick – fühlt sich an wie ein haptischer Tipp */
  function click(at, gain, freq){
    const t = ctx.currentTime + at;
    const s = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 1.4;
    env(g, t, gain, .001, .028);
    s.connect(bp); bp.connect(g); route(g, 0);
    s.start(t, Math.random()*.1, .05);
  }
  /* Luftiges Wischen beim Löschen */
  function swish(at, dur, from, to, gain){
    const t = ctx.currentTime + at;
    const s = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; bp.type = 'bandpass'; bp.Q.value = .9;
    bp.frequency.setValueAtTime(from, t); bp.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + dur*.35);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp); bp.connect(g); route(g, .3);
    s.start(t, 0, dur + .05);
  }

  const play = fn => { if(!App.state.meta.sound) return; try{ ensure(); fn(); }catch(e){} };
  return {
    // Abhaken: Klick + zwei aufsteigende Glastöne (Quinte)
    complete(){ play(() => { click(0, .32, 3200); bell(1318.5, .0, .42, .22, .35); bell(1975.5, .06, .6, .17, .45); }); },
    // Wieder öffnen: gedämpftes, absteigendes „Tock"
    uncomplete(){ play(() => { click(0, .5, 1600); glide(740, 470, 0, .18, .55, .1); }); },
    // Hinzufügen: weiches, aufsteigendes Blubb
    add(){ play(() => { click(0, .45, 2600); glide(420, 840, .005, .16, .5, .2); }); },
    // Löschen: kurzes Wischen nach unten
    del(){ play(() => { swish(0, .22, 2600, 500, .45); glide(330, 220, .02, .16, .22, 0); }); },
    // Alles erledigt: kleiner, schwebender Akkord (Maj9)
    allDone(){ play(() => { [523.25, 659.25, 783.99, 987.77, 1174.66].forEach((f,i) => bell(f, i*.05, 1.5, .085, .6)); click(0, .12, 3000); }); },
    // Antippen in den Einstellungen: nur ein feiner Klick mit Glanz
    tap(){ play(() => { click(0, .6, 2800); bell(2093, .01, .16, .16, .2); }); }
  };
})();

/* ================= Konstanten ================= */
const KEY = 'bloom_v1';
const THEMES = [
  { cls:'',               name:'Rosé',     bar:'#fbeaf0', sw:'linear-gradient(135deg,#e0779e,#a886de)' },
  { cls:'theme-lavender', name:'Lavendel', bar:'#efe8fb', sw:'linear-gradient(135deg,#9b7fe0,#e083c0)' },
  { cls:'theme-peach',    name:'Peach',    bar:'#fdece2', sw:'linear-gradient(135deg,#ee9466,#e27f9f)' },
  { cls:'theme-mint',     name:'Mint',     bar:'#e2f4ec', sw:'linear-gradient(135deg,#4fbf98,#6fb6dd)' },
  { cls:'theme-dark',     name:'Dark',     bar:'#0c0d12', sw:'linear-gradient(135deg,#1c2030,#3a3f8f)' }
];
const ICONS = ['🌸','⏰','📚','💼','🏋️','⚽','🎮','🖥','🚗','🛒','🍽','💊','✈️','🎯','🔥','🌙'];
const DEFAULT_ROUTINES = [
  { id:'r_wake',  text:'Aufwachen',      icon:'⏰', time:'08:00' },
  { id:'r_sleep', text:'Schlafen gehen', icon:'🌙', time:'22:00' }
];
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const WD_LONG = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MONTHS = ['Jan','Feb','März','Apr','Mai','Juni','Juli','Aug','Sept','Okt','Nov','Dez'];
const ITEM_H = 40;
const RE_DATE = /^\d{4}-\d{2}-\d{2}$/, RE_TIME = /^([01]\d|2[0-3]):[0-5]\d$/;

/* ================= Helfer ================= */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function minutesBetween(a, b){ return toMin(b) - toMin(a); }
function toMin(s){ const p = s.split(':').map(Number); return p[0]*60 + p[1]; }
function toHM(min){
  min = Math.max(0, Math.min(23*60+55, Math.round(min/5)*5));
  return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0');
}
function fmtDur(min){
  const h = Math.floor(min/60), m = min%60;
  return (h ? h+'h' : '') + (h && m ? ' ' : '') + (m || !h ? m+'min' : '');
}
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function safeId(v){ const s = String(v||'').replace(/[^A-Za-z0-9_-]/g,''); return s || newId(); }

/* Gespeicherte bzw. importierte Daten auf gültige Werte bringen */
function cleanTodo(t, i){
  if(!t || typeof t !== 'object') return null;
  const text = String(t.text||'').trim().slice(0,140);
  if(!text) return null;
  const time = RE_TIME.test(t.time||'') ? t.time : '';
  const o = {
    id: safeId(t.id), text,
    note: String(t.note||'').slice(0,200),
    icon: ICONS.indexOf(t.icon) >= 0 ? t.icon : '',
    prio: t.prio === 1 ? 1 : 0,
    done: !!t.done,
    created: Number(t.created) || Date.now(),
    date: RE_DATE.test(t.date||'') ? t.date : '',
    time,
    end: time && RE_TIME.test(t.end||'') && t.end > time ? t.end : '',
    ord: typeof t.ord === 'number' ? t.ord : i
  };
  if(o.done) o.doneAt = Number(t.doneAt) || Date.now();
  // Termin mit Uhrzeit braucht ein Datum, sonst wäre er nirgends sichtbar
  if(o.time && !o.date) o.date = App.fmtDate(new Date());
  return o;
}
function cleanRoutine(r){
  if(!r || typeof r !== 'object' || !RE_TIME.test(r.time||'')) return null;
  return { id: safeId(r.id), text: String(r.text||'Routine').slice(0,60),
           icon: ICONS.indexOf(r.icon) >= 0 ? r.icon : '⏰', time: r.time };
}

let toastTimer;
function toast(msg, withUndo){
  const el = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastAct').classList.toggle('on', !!withUndo);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), withUndo ? 4500 : 2400);
}

/* ================= App ================= */
const App = {
  state: {
    todos: [],
    meta: { sound:true, theme:0, name:'Sophia', routines: DEFAULT_ROUTINES.map(r=>({...r})) },
    view: 'list',
    selDate: '',
    editId: null,
    editRoutineId: null,
    newPrio: 0,
    newIcon: '',
    selHour: null,
    selMin: 0,
    newDur: 0
  },
  _undo: null,
  _today: '',

  /* ---------- Speichern & Laden ---------- */
  load(){
    let raw = {};
    try{ raw = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }catch(e){ raw = {}; }
    this.applyData(raw);
  },
  applyData(raw){
    const todos = Array.isArray(raw.todos) ? raw.todos.map(cleanTodo).filter(Boolean) : [];
    const ids = new Set();
    todos.forEach(t => { while(ids.has(t.id)) t.id = newId(); ids.add(t.id); });
    this.state.todos = todos;
    const m = raw.meta && typeof raw.meta === 'object' ? raw.meta : {};
    const meta = this.state.meta;
    if(typeof m.sound === 'boolean') meta.sound = m.sound;
    if(Number.isInteger(m.theme) && m.theme >= 0 && m.theme < THEMES.length) meta.theme = m.theme;
    if(typeof m.name === 'string') meta.name = m.name.slice(0,20);
    if(Array.isArray(m.routines)) meta.routines = m.routines.map(cleanRoutine).filter(Boolean);
  },
  save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({ todos:this.state.todos, meta:this.state.meta }));
    }catch(e){ toast('Speichern fehlgeschlagen – Speicher voll?'); }
  },

  /* ---------- Datum ---------- */
  fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); },
  parseDate(s){ const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); },
  niceDate(s){ const d = this.parseDate(s); return d.getDate()+'. '+MONTHS[d.getMonth()]; },
  todayStr(){ return this.fmtDate(new Date()); },
  nowHM(){ const n = new Date(); return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); },

  /* ---------- Ansicht ---------- */
  isDesktop(){ return window.matchMedia('(min-width:960px)').matches; },
  setView(v){
    this.state.view = v;
    document.getElementById('segList').classList.toggle('active', v==='list');
    document.getElementById('segCal').classList.toggle('active', v==='cal');
    document.getElementById('listView').style.display = v==='list' ? 'flex' : 'none';
    document.getElementById('calView').style.display = v==='cal' ? 'flex' : 'none';
    document.getElementById('calView').style.flexDirection = 'column';
    document.getElementById('calView').style.gap = '14px';
    this.render();
    window.scrollTo(0,0);
  },
  shiftWeek(dir){
    const d = this.parseDate(this.state.selDate);
    d.setDate(d.getDate() + dir*7);
    this.state.selDate = this.fmtDate(d);
    this.render();
  },
  goToday(){ this.state.selDate = this.todayStr(); this.render(); },
  selectDay(s){ this.state.selDate = s; this.render(); },

  /* ---------- Theme-abhängige Zeichen ---------- */
  isDark(){ return (THEMES[this.state.meta.theme] || THEMES[0]).cls === 'theme-dark'; },
  prioEmoji(){ return this.isDark() ? '⚡' : '💗'; },
  defaultIcon(){ return this.isDark() ? '🎯' : '🌸'; },

  /* ---------- Neu / Bearbeiten ---------- */
  /* Vorschlag: jetzt beim ersten Termin des Tages, sonst direkt nach dem letzten Termin */
  suggestTime(dateStr){
    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();
    const isToday = dateStr === this.fmtDate(now);
    const timed = this.state.todos.filter(t => t.date === dateStr && t.time);
    let m = timed.length
      ? Math.max.apply(null, timed.map(t => t.end ? toMin(t.end) : toMin(t.time) + 60))
      : (isToday ? nowMin : 12*60);
    if(isToday) m = Math.max(m, nowMin);
    return toHM(Math.min(Math.ceil(m/5)*5, 23*60+55));
  },
  openAdd(kind){
    if(!kind) kind = (this.state.view === 'cal') ? 'plan' : 'task';
    const s = this.state;
    s.editId = null; s.editRoutineId = null;
    const date = kind === 'plan' ? (s.selDate || this.todayStr()) : '';
    this.fillSheet({ text:'', note:'', prio:0, icon:'', date, time: kind === 'plan' ? this.suggestTime(date) : '', end:'' }, false);
    document.getElementById('sheetTitle').textContent = kind === 'plan' ? 'Neuer Termin' : 'Neue Aufgabe';
    document.getElementById('saveBtn').textContent = 'Hinzufügen';
    document.getElementById('sheetDelBtn').hidden = true;
    this.openSheet('addSheet');
    setTimeout(()=>document.getElementById('taskInput').focus({preventScroll:true}), 360);
  },
  openEdit(id){
    if(this._justDragged) return;
    const t = this.state.todos.find(x=>x.id===id);
    if(!t) return;
    this.state.editId = id; this.state.editRoutineId = null;
    this.fillSheet(t, false);
    document.getElementById('sheetTitle').textContent = t.time ? 'Termin' : 'Aufgabe';
    document.getElementById('saveBtn').textContent = 'Sichern';
    const del = document.getElementById('sheetDelBtn');
    del.hidden = false; del.textContent = t.time ? 'Termin löschen' : 'Aufgabe löschen';
    this.openSheet('addSheet');
  },
  openRoutine(id){
    if(this._justDragged) return;
    const r = this.state.meta.routines.find(x=>x.id===id);
    if(!r) return;
    this.state.editId = null; this.state.editRoutineId = id;
    this.fillSheet({ text:r.text, note:'', prio:0, icon:r.icon, date:'', time:r.time, end:'' }, true);
    document.getElementById('sheetTitle').textContent = 'Routine';
    document.getElementById('saveBtn').textContent = 'Sichern';
    const del = document.getElementById('sheetDelBtn');
    del.hidden = false; del.textContent = 'Routine entfernen';
    this.openSheet('addSheet');
  },
  fillSheet(v, isRoutine){
    const s = this.state;
    const ti = document.getElementById('taskInput');
    ti.value = v.text || ''; ti.classList.remove('shake');
    document.getElementById('noteInput').value = v.note || '';
    document.getElementById('noteInput').hidden = isRoutine;
    document.getElementById('dateInput').value = v.date || '';
    document.getElementById('fWhen').hidden = isRoutine;
    document.getElementById('fPrio').hidden = isRoutine;
    document.getElementById('fRoutineLabel').hidden = !isRoutine;
    if(v.time){ const p = v.time.split(':'); s.selHour = +p[0]; s.selMin = +p[1]; }
    else { s.selHour = null; s.selMin = 0; }
    s.newDur = (v.time && v.end) ? Math.max(0, minutesBetween(v.time, v.end)) : 0;
    this.setPrio(v.prio || 0);
    this.setIcon(v.icon || '');
    this.buildWheels();
    setTimeout(()=>this.syncWheels(), 40);
    setTimeout(()=>this.syncWheels(), 380);
  },
  wheelVals(kind){
    const s = this.state;
    if(kind === 'h'){ const a=[]; for(let i=0;i<24;i++) a.push(i); return a; }
    if(kind === 'm'){ const a=[]; for(let i=0;i<60;i+=5) a.push(i); if(a.indexOf(s.selMin)<0){ a.push(s.selMin); a.sort((x,y)=>x-y); } return a; }
    const a = [0,15,30,45,60,90,120,150,180,240,300,360];
    if(a.indexOf(s.newDur)<0){ a.push(s.newDur); a.sort((x,y)=>x-y); }
    return a;
  },
  buildWheels(){
    const durLabel = d => d===0 ? 'Ohne' : d<60 ? d+' min' : d%60===0 ? (d/60)+' h' : Math.floor(d/60)+'h '+(d%60)+'m';
    const fill = (id, kind, fmt) => {
      document.getElementById(id).innerHTML = '<div class="pad"></div>' +
        this.wheelVals(kind).map(v=>'<div class="witem" data-v="'+v+'">'+fmt(v)+'</div>').join('') + '<div class="pad"></div>';
    };
    fill('wheelH','h', v=>String(v).padStart(2,'0'));
    fill('wheelM','m', v=>String(v).padStart(2,'0'));
    fill('wheelD','d', durLabel);
  },
  syncWheels(){
    const s = this.state;
    document.getElementById('fDur').hidden = !!s.editRoutineId;
    document.getElementById('wheels').classList.toggle('disabled', s.selHour === null);
    document.getElementById('noTimeBtn').classList.toggle('active', s.selHour === null);
    const setPos = (id, kind, val) => {
      const el = document.getElementById(id);
      const idx = Math.max(0, this.wheelVals(kind).indexOf(val));
      el._sync = true;
      el.scrollTop = idx * ITEM_H;
      el.querySelectorAll('.witem').forEach((it,j)=>it.classList.toggle('on', j===idx));
      setTimeout(()=>{ el._sync = false; }, 200);
    };
    setPos('wheelH','h', s.selHour === null ? 12 : s.selHour);
    setPos('wheelM','m', s.selMin);
    setPos('wheelD','d', s.newDur);
  },
  toggleNoTime(){
    const s = this.state;
    if(s.selHour === null){
      const d = document.getElementById('dateInput').value || s.selDate || this.todayStr();
      const p = this.suggestTime(d).split(':');
      s.selHour = +p[0]; s.selMin = +p[1];
      this.buildWheels();
    } else {
      s.selHour = null;
    }
    this.syncWheels();
  },
  setIcon(ic){
    this.state.newIcon = ic;
    const shown = ic || this.defaultIcon();
    document.getElementById('iconChips').innerHTML = ICONS.map(i =>
      '<button class="icon-chip'+(i===shown?' active':'')+'" onclick="App.setIcon(\''+i+'\')" aria-label="Symbol '+i+'">'+i+'</button>'
    ).join('');
  },
  setPrio(p){
    this.state.newPrio = p;
    document.getElementById('prio0').classList.toggle('active', p===0);
    document.getElementById('prio1').classList.toggle('active', p===1);
  },
  saveTask(){
    const s = this.state;
    const ti = document.getElementById('taskInput');
    const text = ti.value.trim();
    if(!text){
      ti.classList.remove('shake'); void ti.offsetWidth; ti.classList.add('shake');
      ti.focus(); return;
    }
    const time = s.selHour === null ? '' : String(s.selHour).padStart(2,'0')+':'+String(s.selMin).padStart(2,'0');
    const icon = s.newIcon || '';

    if(s.editRoutineId){
      const r = s.meta.routines.find(x=>x.id===s.editRoutineId);
      if(r){ r.text = text.slice(0,60); r.icon = icon || r.icon; if(time) r.time = time; }
      this.save(); this.closeSheets(); this.render(); toast('Routine gespeichert');
      return;
    }

    const note = document.getElementById('noteInput').value.trim();
    let date = document.getElementById('dateInput').value || '';
    if(time && !date) date = (s.view === 'cal' || this.isDesktop()) && s.selDate ? s.selDate : this.todayStr();
    const end = (time && s.newDur) ? toHM(toMin(time) + s.newDur) : '';
    const fixedEnd = end && end > time ? end : '';

    if(s.editId){
      const t = s.todos.find(x=>x.id===s.editId);
      if(t){
        const movedToPlan = !t.time && time;
        Object.assign(t, { text, note, prio:s.newPrio, icon, date, time, end:fixedEnd });
        toast(movedToPlan ? 'In den Planer verschoben · '+this.niceDate(date)+', '+time : 'Gespeichert');
      }
    } else {
      const minOrd = s.todos.length ? Math.min.apply(null, s.todos.map(t=>t.ord||0)) : 1;
      s.todos.push({ id:newId(), text, note, prio:s.newPrio, icon, done:false, created:Date.now(), date, time, end:fixedEnd, ord:minOrd-1 });
      Sound.add();
      if(time && !this.isDesktop() && s.view !== 'cal') toast('Im Planer eingetragen · '+this.niceDate(date)+', '+time);
    }
    if(time) s.selDate = date;
    this.save(); this.closeSheets(); this.render();
  },
  removeFromSheet(){
    const s = this.state;
    if(s.editRoutineId){
      const r = s.meta.routines.find(x=>x.id===s.editRoutineId);
      s.meta.routines = s.meta.routines.filter(x=>x.id!==s.editRoutineId);
      this._undo = r ? { routine:r } : null;
      s.editRoutineId = null;
      Sound.del(); this.save(); this.closeSheets(); this.render();
      toast('Routine entfernt', true);
      return;
    }
    if(!s.editId) return;
    const id = s.editId;
    this.closeSheets();
    this.remove(id);
  },
  resetRoutines(){
    this.state.meta.routines = DEFAULT_ROUTINES.map(r=>({...r}));
    this.save(); this.render();
    toast('Routinen zurückgesetzt');
  },
  applyOrder(ids){
    const items = ids.map(id=>this.state.todos.find(t=>t.id===id)).filter(Boolean);
    const ords = items.map(t=>t.ord||0).sort((a,b)=>a-b);
    items.forEach((t,i)=>{ t.ord = ords[i]; });
    this.save(); this.render();
  },

  /* ---------- Erledigen, Löschen, Rückgängig ---------- */
  /* Was heute zählt: alle Aufgaben ohne Uhrzeit + heutige Termine */
  todaySet(){
    const today = this.todayStr();
    return this.state.todos.filter(t => !t.time || t.date === today);
  },
  cleanupDone(){
    const midnight = new Date(); midnight.setHours(0,0,0,0);
    const before = this.state.todos.length;
    this.state.todos = this.state.todos.filter(t => !(t.done && (t.doneAt||0) < midnight.getTime()));
    const changed = this.state.todos.length !== before;
    if(changed) this.save();
    return changed;
  },
  toggle(id){
    if(this._justDragged) return;
    const t = this.state.todos.find(x=>x.id===id);
    if(!t) return;
    t.done = !t.done;
    if(t.done){
      t.doneAt = Date.now();
      Sound.complete();
      const el = document.querySelector('[data-id="'+id+'"] .check');
      if(el) burst(el);
      const set = this.todaySet();
      if(set.length > 1 && set.every(x=>x.done)){
        setTimeout(()=>{ Sound.allDone(); rain(); toast('Alles erledigt. Stark durchgezogen 🔥'); }, 380);
      }
    } else {
      delete t.doneAt;
      Sound.uncomplete();
    }
    this.save();
    setTimeout(()=>this.render(), t.done ? 260 : 0);
  },
  remove(id){
    const t = this.state.todos.find(x=>x.id===id);
    if(!t) return;
    Sound.del();
    const el = document.querySelector('[data-id="'+id+'"]');
    if(el) el.classList.add('removing');
    setTimeout(()=>{
      this.state.todos = this.state.todos.filter(x=>x.id!==id);
      this._undo = { todos:[t] };
      this.save(); this.render();
      toast(t.time ? 'Termin gelöscht' : 'Aufgabe gelöscht', true);
    }, el ? 200 : 0);
  },
  clearDone(){
    const done = this.state.todos.filter(t => t.done && !t.time);
    if(!done.length) return;
    Sound.del();
    this.state.todos = this.state.todos.filter(t => !(t.done && !t.time));
    this._undo = { todos:done };
    this.save(); this.render();
    toast(done.length === 1 ? '1 erledigte Aufgabe gelöscht' : done.length+' erledigte Aufgaben gelöscht', true);
  },
  undo(){
    const u = this._undo;
    if(!u) return;
    if(u.todos) this.state.todos = this.state.todos.concat(u.todos);
    if(u.routine) this.state.meta.routines.push(u.routine);
    this._undo = null;
    this.save(); this.render();
    toast('Wiederhergestellt');
  },

  /* ---------- Sheets ---------- */
  openSheet(id){
    document.querySelectorAll('.sheet.open').forEach(s=>s.classList.remove('open'));
    document.getElementById('overlay').classList.add('open');
    document.getElementById(id).classList.add('open');
    document.getElementById(id).querySelector('.sheet-body').scrollTop = 0;
  },
  closeSheets(){
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    document.getElementById('overlay').classList.remove('open');
    document.querySelectorAll('.sheet.open').forEach(s=>s.classList.remove('open'));
  },

  /* ---------- Einstellungen ---------- */
  openMenu(){ this.renderMenu(); this.openSheet('menuSheet'); },
  renderMenu(){
    document.getElementById('nameInput').value = this.state.meta.name || '';
    document.getElementById('soundSwitch').setAttribute('aria-checked', String(!!this.state.meta.sound));
    document.getElementById('swatches').innerHTML = THEMES.map((t,i) =>
      '<button class="swatch'+(i===this.state.meta.theme?' active':'')+'" onclick="App.setTheme('+i+')" aria-label="Farbwelt '+t.name+'">'+
      '<i style="background:'+t.sw+'"></i>'+t.name+'</button>').join('');
  },
  saveName(){
    const v = document.getElementById('nameInput').value.trim().slice(0,20);
    if(v === this.state.meta.name) return;
    this.state.meta.name = v;
    this.save(); this.renderHeader();
  },
  setTheme(i){
    this.state.meta.theme = i;
    this.save(); this.applyTheme(); this.renderMenu(); this.render(); Sound.tap();
  },
  applyTheme(){
    const root = document.documentElement;
    THEMES.forEach(t => { if(t.cls) root.classList.remove(t.cls); });
    const th = THEMES[this.state.meta.theme] || THEMES[0];
    if(th.cls) root.classList.add(th.cls);
    document.querySelector('meta[name="theme-color"]').setAttribute('content', th.bar);
    document.getElementById('prio1').textContent = this.prioEmoji()+' Wichtig';
    document.getElementById('topbar').style.display = (window.navigator.standalone && !this.isDark()) ? 'block' : 'none';
  },
  toggleSound(){
    this.state.meta.sound = !this.state.meta.sound;
    this.save(); this.renderMenu();
    if(this.state.meta.sound) Sound.tap();
  },
  async exportData(){
    const json = JSON.stringify({ todos:this.state.todos, meta:this.state.meta }, null, 2);
    const name = 'bloom-backup-'+this.todayStr()+'.json';
    // iPhone: Teilen-Menü (in Dateien sichern, AirDrop …) — klappt auch in der Home-Bildschirm-App
    try{
      const file = new File([json], name, { type:'application/json' });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        await navigator.share({ files:[file], title:'Bloom Backup' });
        return;
      }
    }catch(e){ if(e && e.name === 'AbortError') return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], { type:'application/json' }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    toast('Backup gesichert');
  },
  importData(ev){
    const file = ev.target.files && ev.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(!data || !Array.isArray(data.todos)) throw new Error('kein Bloom-Backup');
        this.applyData(data);
        this.save(); this.applyTheme(); this.renderHeader(); this.renderMenu(); this.render();
        toast('Backup geladen · '+this.state.todos.length+' Einträge');
      }catch(e){ toast('Das ist kein gültiges Bloom-Backup'); }
      ev.target.value = '';
    };
    reader.readAsText(file);
  },

  /* ---------- Darstellung ---------- */
  taskHtml(t){
    const meta = [];
    if(t.prio === 1 && !t.done) meta.push('<span class="mchip prio">'+this.prioEmoji()+' Wichtig</span>');
    if(t.date) meta.push('<span class="mchip when">'+this.niceDate(t.date)+'</span>');
    return '<div class="task'+(t.done?' done':'')+'" data-id="'+t.id+'">'+
      '<button class="check" onclick="App.toggle(\''+t.id+'\')" aria-label="'+(t.done?'Als offen markieren':'Erledigt')+'">'+
        '<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6"/></svg></button>'+
      '<span class="ticon" aria-hidden="true">'+esc(t.icon || this.defaultIcon())+'</span>'+
      '<div class="tbody" onclick="App.openEdit(\''+t.id+'\')">'+
        '<div class="tlabel">'+esc(t.text)+'</div>'+
        (t.note ? '<div class="tnote">'+esc(t.note)+'</div>' : '')+
        (meta.length ? '<div class="tmeta">'+meta.join('')+'</div>' : '')+
      '</div>'+
      (t.done ? '' : '<button class="tbtn drag" aria-label="Verschieben"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></button>')+
      '<button class="tbtn" onclick="App.remove(\''+t.id+'\')" aria-label="Löschen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
    '</div>';
  },

  render(){
    if(!this.state.selDate) this.state.selDate = this.todayStr();
    const desk = this.isDesktop();
    if(desk || this.state.view === 'list') this.renderList();
    if(desk || this.state.view === 'cal') this.renderCal();
  },

  renderList(){
    const s = this.state;
    const open = s.todos.filter(t => !t.time && !t.done).sort((a,b) => (a.ord||0) - (b.ord||0));
    const done = s.todos.filter(t => !t.time && t.done).sort((a,b) => (b.doneAt||0) - (a.doneAt||0));

    document.getElementById('openCount').textContent = open.length ? ' · '+open.length : '';
    document.getElementById('list').innerHTML = open.length
      ? open.map(t => this.taskHtml(t)).join('')
      : '<div class="empty"><span class="em">'+(done.length ? '🎉' : (this.isDark() ? '🗒' : '🌿'))+'</span>'+
        (done.length ? 'Alles erledigt. Sauber durchgezogen.' : 'Noch keine Aufgaben.<br>Tipp auf + und leg los.')+'</div>';
    document.getElementById('doneWrap').hidden = !done.length;
    document.getElementById('doneList').innerHTML = done.map(t => this.taskHtml(t)).join('');

    // Tagesübersicht
    const set = this.todaySet();
    const total = set.length, fin = set.filter(t=>t.done).length;
    const pct = total ? Math.round(fin/total*100) : 0;
    document.getElementById('pct').textContent = pct+'%';
    document.getElementById('ringFill').style.strokeDashoffset = (169.6 - 169.6*pct/100).toFixed(1);
    const big = document.getElementById('sumBig'), small = document.getElementById('sumSmall');
    if(!total){ big.textContent = 'Dein Tag ist noch leer'; small.textContent = 'Tipp auf + und leg los'; }
    else if(fin === total){ big.textContent = 'Alles erledigt'; small.textContent = 'Nichts mehr offen. Respekt.'; }
    else { big.textContent = fin+' von '+total+' erledigt'; small.textContent = (total-fin)+' noch offen für heute'; }

  },

  renderCal(){
    const s = this.state;
    const sel = this.parseDate(s.selDate);
    const today = this.todayStr();
    const monday = new Date(sel); monday.setDate(sel.getDate() - ((sel.getDay()+6)%7));
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    document.getElementById('calLabel').textContent = monday.getMonth() === sunday.getMonth()
      ? monday.getDate()+'. – '+sunday.getDate()+'. '+MONTHS[sunday.getMonth()]
      : monday.getDate()+'. '+MONTHS[monday.getMonth()]+' – '+sunday.getDate()+'. '+MONTHS[sunday.getMonth()];
    document.getElementById('todayBtn').hidden = s.selDate === today;

    let strip = '';
    for(let i=0;i<7;i++){
      const d = new Date(monday); d.setDate(monday.getDate()+i);
      const ds = this.fmtDate(d);
      const has = s.todos.some(t => t.time && t.date === ds && !t.done);
      strip += '<button class="day'+(ds===s.selDate?' sel':'')+(ds===today?' today':'')+(has?' has':'')+'" onclick="App.selectDay(\''+ds+'\')" aria-label="'+WD_LONG[d.getDay()]+', '+d.getDate()+'. '+MONTHS[d.getMonth()]+'">'+
        '<span class="wd">'+WD[d.getDay()]+'</span><span class="num">'+d.getDate()+'</span><span class="dot"></span></button>';
    }
    document.getElementById('week').innerHTML = strip;
    document.getElementById('dayTitle').textContent =
      WD_LONG[sel.getDay()]+', '+sel.getDate()+'. '+MONTHS[sel.getMonth()] + (s.selDate === today ? ' · Heute' : '');

    const routines = s.meta.routines.map(r => ({ id:r.id, text:r.text, icon:r.icon, time:r.time, end:'', note:'', prio:0, done:false, routine:true }));
    const timed = s.todos.filter(t => t.time && t.date === s.selDate).concat(routines)
      .sort((a,b) => a.time < b.time ? -1 : a.time > b.time ? 1 : 0);

    if(!timed.length){
      document.getElementById('dayList').innerHTML =
        '<div class="card"><div class="empty"><span class="em">🗓</span>Nichts geplant an diesem Tag.<br>Tipp auf + für einen Termin.</div></div>';
      return;
    }
    const isToday = s.selDate === today;
    const nowHM = this.nowHM();
    const nowRow = '<div class="tlx-now"><span class="t">'+nowHM+'</span><span class="ln"></span></div>';
    let nowDone = !isToday, rows = '';
    timed.forEach((t, i) => {
      if(!nowDone && nowHM < t.time){ rows += nowRow; nowDone = true; }
      if(i > 0){
        const g = minutesBetween(timed[i-1].end || timed[i-1].time, t.time);
        if(g >= 45) rows += '<div class="tlx-gap"><div class="sp"></div><div class="rail"></div><div class="msg">Frei · <b>'+fmtDur(g)+'</b></div></div>';
      }
      let sub = t.time + (t.end ? ' – '+t.end : '') + (t.routine ? ' · täglich' : '');
      let subCls = '';
      if(isToday && !t.done && t.end && t.time <= nowHM && nowHM < t.end){ sub = 'Läuft · noch '+fmtDur(minutesBetween(nowHM, t.end)); subCls = ' now'; }
      if(t.prio === 1 && !t.done) sub += ' · '+this.prioEmoji()+' Wichtig';
      const edit = t.routine ? 'App.openRoutine' : 'App.openEdit';
      rows += '<div class="tlx-row'+(t.done?' done':'')+(t.routine?' routine':'')+'" data-id="'+t.id+'">'+
        '<div class="tlx-time"><span class="t1">'+t.time+'</span>'+(t.end ? '<span class="t2">'+t.end+'</span>' : '')+'</div>'+
        '<div class="tlx-rail"><div class="tlx-bubble'+(t.end?' pill':'')+'">'+esc(t.icon || this.defaultIcon())+'</div></div>'+
        '<div class="tlx-body">'+
          '<div class="tlx-info" onclick="'+edit+'(\''+t.id+'\')">'+
            '<div class="tlx-sub'+subCls+'">'+sub+'</div>'+
            '<div class="tlx-title">'+esc(t.text)+'</div>'+
            (t.note ? '<div class="tlx-note">'+esc(t.note)+'</div>' : '')+
          '</div>'+
          (t.routine ? '' : '<button class="check" onclick="App.toggle(\''+t.id+'\')" aria-label="'+(t.done?'Als offen markieren':'Erledigt')+'"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6"/></svg></button>')+
        '</div></div>';
    });
    if(!nowDone) rows += nowRow;
    document.getElementById('dayList').innerHTML =
      '<div class="card panel">'+rows+'</div><p class="hint">Gedrückt halten und ziehen, um die Uhrzeit zu ändern</p>';
  },

  renderHeader(){
    const d = new Date(), h = d.getHours();
    const name = this.state.meta.name;
    const withName = txt => name ? txt+', '+name : txt;
    document.getElementById('hello').textContent = h < 11 ? withName('Good morning') : h < 17 ? withName('Good afternoon') : withName('Good evening');
    document.getElementById('title').innerHTML = WD_LONG[d.getDay()]+', <b>'+d.getDate()+'. '+MONTHS[d.getMonth()]+'</b>';
    const morning = ['Win the first hour. The rest will follow.','Start before you feel ready.','Discipline beats motivation. Show up.','One focused hour beats a scattered day.', withName('Set the tone early')+'.'];
    const afternoon = [withName('Afternoon wins coming your way')+'.','Push yourself — no one else is going to do it for you.','Done is better than perfect. Keep moving.','Consistency is a form of self-respect.','Nobody is coming to save your to-do list.'];
    const evening = ['Finish strong. Future you is watching.','One more win before you close the day.','What you do daily becomes who you are.','Rest is earned. Almost there.', withName('End the day on your terms')+'.'];
    const pool = h < 11 ? morning : h < 17 ? afternoon : evening;
    document.getElementById('quote').textContent = pool[d.getDate() % pool.length];
  },

  /* Tageswechsel, Aufräumen um 0 Uhr, Jetzt-Linie — auch nach dem Zurückkehren aus dem Hintergrund */
  tick(){
    const today = this.todayStr();
    if(today !== this._today){
      if(this.state.selDate === this._today) this.state.selDate = today;
      this._today = today;
    }
    this.cleanupDone();
    this.renderHeader();
    this.render();
  },

  init(){
    this.load();
    this._today = this.todayStr();
    this.state.selDate = this._today;
    this.cleanupDone();
    this.save();
    this.applyTheme();
    this.renderHeader();
    this.setView('list');

    setupDrag(document.getElementById('list'));
    setupTimeDrag(document.getElementById('dayList'));

    [['wheelH','h'],['wheelM','m'],['wheelD','d']].forEach(([id,kind]) => {
      const el = document.getElementById(id);
      let timer = null;
      el.addEventListener('scroll', () => {
        if(el._sync) return;
        clearTimeout(timer);
        timer = setTimeout(() => {
          const items = el.querySelectorAll('.witem');
          if(!items.length) return;
          const idx = Math.max(0, Math.min(items.length-1, Math.round(el.scrollTop/ITEM_H)));
          const v = +items[idx].dataset.v;
          if(kind === 'h') this.state.selHour = v; else if(kind === 'm') this.state.selMin = v; else this.state.newDur = v;
          items.forEach((it,j)=>it.classList.toggle('on', j===idx));
        }, 90);
      }, { passive:true });
    });

    const ti = document.getElementById('taskInput'), ni = document.getElementById('noteInput');
    ti.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); this.saveTask(); } });
    ni.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); this.saveTask(); } });
    const nameIn = document.getElementById('nameInput');
    nameIn.addEventListener('change', () => this.saveName());
    nameIn.addEventListener('keydown', e => { if(e.key === 'Enter'){ nameIn.blur(); } });
    document.addEventListener('keydown', e => { if(e.key === 'Escape') this.closeSheets(); });

    setInterval(() => this.tick(), 60000);
    document.addEventListener('visibilitychange', () => { if(!document.hidden) this.tick(); });
    window.addEventListener('pageshow', () => this.tick());
    window.matchMedia('(min-width:960px)').addEventListener('change', () => this.setView(this.state.view));
  }
};

/* ================= Aufgaben per Griff umsortieren ================= */
function setupDrag(container){
  let row = null, moved = false;
  const rows = () => Array.prototype.slice.call(container.querySelectorAll('.task[data-id]'));
  function start(target){
    const h = target.closest && target.closest('.drag');
    if(!h) return false;
    row = h.closest('.task'); moved = false;
    if(row) row.classList.add('dragging');
    return !!row;
  }
  function move(y){
    if(!row) return;
    for(const r of rows()){
      if(r === row) continue;
      const rect = r.getBoundingClientRect();
      if(y > rect.top && y < rect.top + rect.height/2){ if(r.previousElementSibling !== row){ container.insertBefore(row, r); moved = true; } break; }
      if(y >= rect.top + rect.height/2 && y < rect.bottom){ if(r.nextElementSibling !== row){ container.insertBefore(row, r.nextSibling); moved = true; } break; }
    }
  }
  function end(){
    if(!row) return;
    row.classList.remove('dragging');
    const ids = rows().map(r => r.dataset.id);
    row = null;
    if(moved) App.applyOrder(ids);
  }
  container.addEventListener('touchstart', e => { if(start(e.target)) e.preventDefault(); }, { passive:false });
  container.addEventListener('touchmove', e => { if(row){ e.preventDefault(); move(e.touches[0].clientY); } }, { passive:false });
  container.addEventListener('touchend', end);
  container.addEventListener('touchcancel', end);
  container.addEventListener('mousedown', e => { if(start(e.target)) e.preventDefault(); });
  document.addEventListener('mousemove', e => { if(row) move(e.clientY); });
  document.addEventListener('mouseup', end);
}

/* ================= Planer: Termin halten & ziehen → neue Uhrzeit ================= */
function setupTimeDrag(container){
  const MIN_PER_PX = 0.8, EDGE = 120, EDGE_SPEED = 2.2;
  let row=null, item=null, timer=null, startY=0, lastY=0, active=false;
  let origMin=0, dur=0, newMin=0, edge=0, raf=null, origTop=0, rowH=0;
  const findItem = id => App.state.todos.find(t=>t.id===id) || App.state.meta.routines.find(r=>r.id===id);
  const clearTimer = () => { if(timer){ clearTimeout(timer); timer = null; } };

  function begin(target, y){
    const r = target.closest ? target.closest('.tlx-row') : null;
    if(!r || target.closest('.check')) return;
    row = r; startY = y; lastY = y; active = false;
    timer = setTimeout(() => {
      item = findItem(row.dataset.id);
      if(!item || !item.time){ row = null; return; }
      active = true;
      origMin = toMin(item.time); dur = item.end ? minutesBetween(item.time, item.end) : 0;
      newMin = origMin; edge = 0;
      const rect = row.getBoundingClientRect(); origTop = rect.top; rowH = rect.height;
      row.classList.add('dragging');
      if(navigator.vibrate) navigator.vibrate(10);
      raf = requestAnimationFrame(step);
    }, 320);
  }
  function step(){
    if(!row || !active){ raf = null; return; }
    const vh = window.innerHeight;
    if(lastY < EDGE) edge -= ((EDGE - lastY) / EDGE) * EDGE_SPEED;
    else if(lastY > vh - EDGE) edge += ((lastY - (vh - EDGE)) / EDGE) * EDGE_SPEED;
    const dy = lastY - startY;
    let m = Math.round((origMin + dy*MIN_PER_PX + edge)/5)*5;
    m = Math.max(0, Math.min(23*60+55 - dur, m));
    if(m !== newMin){
      newMin = m;
      const t1 = row.querySelector('.t1'), t2 = row.querySelector('.t2'), sub = row.querySelector('.tlx-sub');
      if(t1) t1.textContent = toHM(m);
      if(t2) t2.textContent = toHM(m + dur);
      if(sub) sub.textContent = toHM(m) + (dur ? ' – '+toHM(m+dur) : '');
    }
    const vis = Math.max(70 - origTop, Math.min((vh - 100) - (origTop + rowH), dy));
    row.style.transform = 'translateY('+vis+'px)';
    raf = requestAnimationFrame(step);
  }
  function finish(){
    clearTimer();
    if(raf){ cancelAnimationFrame(raf); raf = null; }
    if(row && active){
      row.classList.remove('dragging'); row.style.transform = '';
      App._justDragged = true;
      setTimeout(() => { App._justDragged = false; }, 400);
      if(newMin !== origMin){
        item.time = toHM(newMin);
        if(dur) item.end = toHM(newMin + dur);
        App.save(); App.render();
        toast('Verschoben auf '+item.time);
      }
    }
    row = null; item = null; active = false;
  }
  container.addEventListener('touchstart', e => begin(e.target, e.touches[0].clientY), { passive:true });
  container.addEventListener('touchmove', e => {
    if(!row) return;
    const y = e.touches[0].clientY;
    if(!active){ if(Math.abs(y - startY) > 10){ clearTimer(); row = null; } return; }
    e.preventDefault(); lastY = y;
  }, { passive:false });
  container.addEventListener('touchend', finish);
  container.addEventListener('touchcancel', finish);
  container.addEventListener('contextmenu', e => { if(active) e.preventDefault(); });
  container.addEventListener('mousedown', e => begin(e.target, e.clientY));
  document.addEventListener('mousemove', e => {
    if(!row) return;
    if(!active){ if(Math.abs(e.clientY - startY) > 8){ clearTimer(); row = null; } return; }
    lastY = e.clientY;
  });
  document.addEventListener('mouseup', finish);
}

/* ================= Konfetti ================= */
function burst(el){
  const r = el.getBoundingClientRect();
  const x = r.left + r.width/2, y = r.top + r.height/2;
  const colors = ['#e0779e','#a886de','#f6bcd0','#8bc9e5','#ffd6a5','#c4b5f7'];
  for(let i=0;i<12;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.background = colors[i % colors.length];
    c.style.left = x+'px'; c.style.top = y+'px';
    if(i % 3 === 0) c.style.borderRadius = '50%';
    document.body.appendChild(c);
    const ang = Math.random()*Math.PI*2, dist = 30 + Math.random()*60;
    c.animate([
      { transform:'translate(0,0) rotate(0) scale(1)', opacity:1 },
      { transform:'translate('+(Math.cos(ang)*dist)+'px,'+(Math.sin(ang)*dist-24)+'px) rotate('+(Math.random()*540)+'deg) scale(.3)', opacity:0 }
    ], { duration:650+Math.random()*350, easing:'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => c.remove();
  }
}
function rain(){
  const colors = ['#e0779e','#a886de','#f6bcd0','#8bc9e5','#ffd6a5','#c4b5f7','#a0e5c9'];
  for(let i=0;i<50;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.background = colors[i % colors.length];
    c.style.left = Math.random()*window.innerWidth+'px'; c.style.top = '-16px';
    if(i % 2 === 0) c.style.borderRadius = '50%';
    document.body.appendChild(c);
    c.animate([
      { transform:'translate(0,0) rotate(0)', opacity:1 },
      { transform:'translate('+((Math.random()-.5)*180)+'px,'+(window.innerHeight+30)+'px) rotate('+(Math.random()*720)+'deg)', opacity:1, offset:.9 },
      { opacity:0 }
    ], { duration:2000+Math.random()*1100, easing:'cubic-bezier(.3,.6,.5,1)' }).onfinish = () => c.remove();
  }
}

App.init();
