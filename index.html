<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#fbe9ef" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Bloom" />
<title>Bloom · To-Do</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" />
<style>
:root{
  --bg1:#fbe9ef; --bg2:#efe6fb; --bg3:#e6f0fb;
  --blob1:#f6bcd0; --blob2:#c4b5f7;
  --card:rgba(255,255,255,.55);
  --card-solid:#fff;
  --ink:#4a3d52;
  --soft:#8a7d91;
  --faint:#c3b6cb;
  --accent:#e58ba9;
  --accent-2:#b48be5;
  --accent-soft:#f7d9e3;
  --line:rgba(180,139,229,.18);
  --shadow:0 16px 44px -18px rgba(150,110,180,.5);
  --done:#b7a9c9;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{
  min-height:100%;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Nunito,sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2) 45%,var(--bg3));
  background-size:200% 200%;
  animation:drift 24s ease infinite;
  display:flex; justify-content:center;
  overscroll-behavior-y:none;
  transition:background .8s ease;
}
@keyframes drift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* weiche Pastell-Blobs im Hintergrund */
body::before,body::after{
  content:""; position:fixed; border-radius:50%; filter:blur(60px); opacity:.5; pointer-events:none; z-index:0;
}
body::before{width:320px;height:320px;background:var(--blob1);top:-100px;left:-90px;animation:float1 18s ease-in-out infinite;}
body::after{width:300px;height:300px;background:var(--blob2);bottom:-110px;right:-80px;animation:float2 22s ease-in-out infinite;}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,30px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,-30px)}}

#app{
  position:relative; z-index:1; width:100%; max-width:430px;
  padding:max(20px, env(safe-area-inset-top)) 18px calc(110px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:16px;
}

/* ---------- Header ---------- */
.header{display:flex; align-items:flex-start; justify-content:space-between; padding:8px 4px 0;}
.header .hello{font-size:.9rem; color:var(--soft); font-weight:600; letter-spacing:.3px;}
.header .date{font-size:1.65rem; font-weight:800; letter-spacing:-.4px; margin-top:2px;}
.header .date b{background:linear-gradient(120deg,var(--accent),var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.header .quote{font-size:.82rem; color:var(--soft); margin-top:5px;}
.menu-btn{
  width:42px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.6);
  background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:var(--ink);font-size:1.25rem;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
  box-shadow:0 8px 22px -12px rgba(150,110,180,.5);
}
.menu-btn:active{transform:scale(.92);}

/* ---------- Ansicht-Umschalter ---------- */
.segmented{
  display:flex;gap:6px;background:rgba(255,255,255,.45);border-radius:17px;padding:5px;
}
.seg{
  flex:1;border:none;background:transparent;color:var(--soft);
  font-family:inherit;font-size:.88rem;font-weight:700;padding:10px 0;border-radius:13px;cursor:pointer;transition:.2s;
}
.seg.active{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  box-shadow:0 8px 18px -8px rgba(180,110,160,.8);
}

/* ---------- Progress-Karte ---------- */
.progress-card{
  background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.6); border-radius:24px; padding:20px;
  display:flex; align-items:center; gap:18px; box-shadow:var(--shadow);
}
.ring{position:relative;width:80px;height:80px;flex:none;}
.ring svg{transform:rotate(-90deg);display:block;}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;}
.progress-card .big{font-size:1.08rem;font-weight:800;}
.progress-card .small{font-size:.84rem;color:var(--soft);margin-top:3px;}
.streak{
  display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:.78rem;font-weight:700;
  color:var(--accent-2);background:rgba(180,139,229,.12);
  padding:4px 11px;border-radius:20px;
}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:8px;}
.tab{
  flex:1;border:none;background:rgba(255,255,255,.45);color:var(--soft);
  font-family:inherit;font-size:.85rem;font-weight:700;padding:10px 0;border-radius:15px;cursor:pointer;transition:.2s;
}
.tab.active{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  box-shadow:0 8px 18px -8px rgba(180,110,160,.8);
}

/* ---------- Kalender ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px;}
.cal-head .label{font-size:1rem;font-weight:800;}
.cal-nav{
  width:38px;height:38px;border-radius:13px;border:1px solid rgba(255,255,255,.6);
  background:var(--card);color:var(--ink);font-size:1.05rem;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.cal-nav:active{transform:scale(.9);}
.week{display:flex;gap:5px;}
.day{
  flex:1;border:none;background:rgba(255,255,255,.45);border-radius:14px;padding:9px 0 7px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit;color:var(--ink);
}
.day .wd{font-size:.62rem;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.4px;}
.day .num{font-size:.95rem;font-weight:800;}
.day .dot{width:5px;height:5px;border-radius:50%;background:transparent;}
.day.has .dot{background:var(--accent);}
.day.today .num{color:var(--accent);}
.day.sel{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 8px 18px -8px rgba(180,110,160,.8);
}
.day.sel .wd,.day.sel .num{color:#fff;}
.day.sel .dot{background:rgba(255,255,255,.85);}
.day-title{font-size:.85rem;font-weight:700;color:var(--soft);padding:2px 4px 0;}
.day-sub{font-size:.72rem;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;padding:4px 4px 0;}

/* ---------- Timeline (Zeitstrahl wie Tagesplaner) ---------- */
.panel{
  background:var(--card-solid);border:1px solid var(--line);border-radius:26px;
  padding:12px 12px 16px;box-shadow:var(--shadow);
}
.tlx-row{
  display:flex;align-items:stretch;position:relative;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.tlx-row.dragging{
  opacity:.92;transform:scale(1.015);z-index:15;
  background:rgba(255,255,255,.95);border-radius:18px;
  box-shadow:0 18px 40px -14px rgba(150,110,180,.75);
}
.tlx-time{
  width:50px;flex:none;display:flex;flex-direction:column;justify-content:space-between;
  align-items:flex-end;padding:16px 8px 16px 0;font-variant-numeric:tabular-nums;
}
.tlx-time .t1{font-size:.75rem;font-weight:800;color:var(--ink);}
.tlx-time .t2{font-size:.7rem;font-weight:600;color:var(--soft);}
.tlx-rail{width:54px;flex:none;position:relative;display:flex;flex-direction:column;align-items:center;padding:8px 0;}
.tlx-rail::before{
  content:"";position:absolute;top:0;bottom:0;left:50%;margin-left:-1px;
  border-left:2px dashed rgba(180,139,229,.3);
}
.tlx-bubble{
  position:relative;z-index:1;width:46px;min-height:46px;border-radius:23px;
  background:linear-gradient(160deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;
  box-shadow:0 8px 18px -8px rgba(180,110,160,.8);
}
.tlx-bubble.pill{flex:1;align-items:flex-start;padding-top:11px;}
.tlx-row.done .tlx-bubble{background:#e9e4ee;box-shadow:none;filter:grayscale(.35);opacity:.8;}
.tlx-body{flex:1;min-width:0;display:flex;align-items:flex-start;gap:8px;padding:12px 0 16px 12px;}
.tlx-info{flex:1;min-width:0;cursor:pointer;}
.tlx-sub{font-size:.72rem;font-weight:700;color:var(--soft);}
.tlx-sub.now{color:var(--accent);}
.tlx-title{font-size:1.02rem;font-weight:800;line-height:1.3;word-break:break-word;}
.tlx-row.done .tlx-title{color:var(--done);text-decoration:line-through;}
.tlx-note{font-size:.78rem;color:var(--soft);margin-top:2px;word-break:break-word;}
.tlx-check{
  width:27px;height:27px;border-radius:50%;flex:none;margin-top:6px;cursor:pointer;
  border:2.5px solid var(--accent-soft);background:transparent;padding:0;
  display:flex;align-items:center;justify-content:center;transition:.25s;
}
.tlx-check svg{width:14px;height:14px;stroke:#fff;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s ease .05s;}
.tlx-row.done .tlx-check{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;}
.tlx-row.done .tlx-check svg{stroke-dashoffset:0;}
.tlx-gap{display:flex;align-items:center;min-height:42px;}
.tlx-gap .sp{width:50px;flex:none;}
.tlx-gap .rail{width:54px;flex:none;align-self:stretch;position:relative;}
.tlx-gap .rail::before{
  content:"";position:absolute;top:0;bottom:0;left:50%;margin-left:-1px;
  border-left:2px dashed rgba(180,139,229,.3);
}
.tlx-gap .msg{flex:1;padding-left:12px;font-size:.79rem;color:var(--soft);}
.tlx-gap .msg b{color:var(--accent);}
.tlx-now{display:flex;align-items:center;padding:2px 0;}
.tlx-now .t{width:50px;flex:none;text-align:right;padding-right:8px;font-size:.72rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;}
.tlx-now .ln{flex:1;height:2px;border-radius:2px;background:var(--accent);opacity:.55;}

/* Uhrzeit-Wheels im Sheet (wie iOS-Wecker) */
.wheels{display:flex;gap:9px;transition:opacity .2s;}
.wheels.disabled{opacity:.35;pointer-events:none;}
.wheel-group{flex:1;min-width:0;}
.wheel-cap{
  font-size:.68rem;font-weight:700;color:var(--faint);text-transform:uppercase;
  letter-spacing:.4px;text-align:center;margin-bottom:5px;
}
.wheel{
  position:relative;height:132px;overflow-y:auto;border-radius:15px;
  background:#faf7fb;border:1px solid var(--line);
  scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.wheel::-webkit-scrollbar{display:none;}
.wheel .pad{height:44px;}
.witem{
  height:44px;display:flex;align-items:center;justify-content:center;
  scroll-snap-align:center;font-weight:700;font-size:.98rem;color:var(--faint);
  font-variant-numeric:tabular-nums;
}
.witem.on{color:var(--accent);font-size:1.12rem;}

/* Icon-Auswahl im Sheet */
.icon-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px;}
.icon-chip{
  width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#faf7fb;
  font-size:1.25rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.icon-chip.active{background:rgba(229,139,169,.12);border-color:rgba(229,139,169,.5);}

/* ---------- Liste ---------- */
.list{display:flex;flex-direction:column;gap:11px;}
.task{
  display:flex;align-items:flex-start;gap:13px;
  background:var(--card-solid);border:1px solid var(--line);border-radius:19px;padding:15px 14px 15px 16px;
  box-shadow:0 10px 30px -18px rgba(150,110,180,.55);
  animation:pop .3s cubic-bezier(.2,1.2,.4,1);
}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.task.removing{opacity:0;transform:translateX(50px) scale(.92);transition:.25s;}
.task .check{
  width:29px;height:29px;border-radius:50%;flex:none;cursor:pointer;margin-top:1px;
  border:2.5px solid var(--accent-soft);display:flex;align-items:center;justify-content:center;background:transparent;padding:0;transition:.25s;
}
.task .check svg{width:15px;height:15px;stroke:#fff;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s ease .05s;}
.task.done .check{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;}
.task.done .check svg{stroke-dashoffset:0;}
.task .body{flex:1;min-width:0;cursor:pointer;}
.task .label{font-size:.96rem;font-weight:600;line-height:1.35;word-break:break-word;}
.task.done .label{color:var(--done);text-decoration:line-through;text-decoration-color:rgba(183,169,201,.6);}
.task .note{font-size:.79rem;color:var(--soft);line-height:1.35;margin-top:3px;word-break:break-word;}
.task.done .note{color:var(--faint);}
.task .chips-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.task .mchip{
  display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:700;
  padding:2px 8px;border-radius:10px;
}
.task .mchip.prio{color:var(--accent);background:rgba(229,139,169,.1);}
.task .mchip.when{color:var(--accent-2);background:rgba(180,139,229,.12);}
.task .del{
  border:none;background:transparent;color:#d9cbe1;font-size:1.05rem;cursor:pointer;padding:6px;border-radius:10px;flex:none;
}
.task .del:active{color:var(--accent);}
.task .drag{
  border:none;background:transparent;color:#d9cbe1;font-size:1.15rem;cursor:grab;padding:6px 4px;flex:none;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
.task.dragging{
  opacity:.92;transform:scale(1.02);box-shadow:0 18px 40px -14px rgba(150,110,180,.75);
  position:relative;z-index:15;
}
.empty{text-align:center;color:var(--soft);padding:44px 20px;font-size:.92rem;}
.empty .em{font-size:2.5rem;display:block;margin-bottom:10px;}

.footer-row{display:flex;justify-content:space-between;align-items:center;padding:0 4px;font-size:.8rem;color:var(--soft);}
.footer-row button{border:none;background:none;color:var(--soft);font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer;padding:6px;}
.footer-row button:active{color:var(--accent);}

/* ---------- FAB ---------- */
.fab{
  position:fixed;z-index:10;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  width:62px;height:62px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:2rem;line-height:1;
  box-shadow:0 12px 30px -6px rgba(180,110,160,.7);
  display:flex;align-items:center;justify-content:center;
}
.fab:active{transform:translateX(-50%) scale(.9);}

/* ---------- Modal / Bottom Sheet ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(90,70,110,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  z-index:20;opacity:0;pointer-events:none;transition:opacity .25s;
}
.overlay.open{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;z-index:21;left:50%;bottom:0;transform:translate(-50%,105%);
  width:100%;max-width:430px;background:var(--card-solid);border-radius:26px 26px 0 0;
  box-shadow:0 -10px 50px -20px rgba(150,110,180,.6);
  padding:14px 20px calc(26px + env(safe-area-inset-bottom));
  transition:transform .32s cubic-bezier(.3,1.1,.35,1);
  max-height:82vh;overflow-y:auto;
}
.sheet.open{transform:translate(-50%,0);}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:var(--faint);opacity:.5;margin:0 auto 16px;}
.sheet h2{font-size:1.08rem;font-weight:800;margin-bottom:14px;}
.sheet input[type=text],.sheet input[type=date],.sheet input[type=time]{
  width:100%;background:#faf7fb;border:1px solid var(--line);border-radius:15px;
  color:var(--ink);font-family:inherit;font-size:1rem;padding:13px 15px;outline:none;
  -webkit-appearance:none;appearance:none;min-height:48px;
}
.sheet input::placeholder{color:var(--faint);}
.sheet input:focus{border-color:rgba(229,139,169,.5);}
.field-label{font-size:.74rem;font-weight:700;color:var(--soft);margin:13px 4px 6px;text-transform:uppercase;letter-spacing:.4px;}
.field-row{display:flex;gap:8px;}
.field-row>div{flex:1;min-width:0;}
.chips{display:flex;gap:8px;margin:14px 0 18px;}
.chip{
  flex:1;border:1px solid var(--line);background:#faf7fb;color:var(--soft);
  font-family:inherit;font-size:.85rem;font-weight:700;padding:11px 0;border-radius:14px;cursor:pointer;
}
.chip.active{background:rgba(229,139,169,.12);border-color:rgba(229,139,169,.5);color:var(--accent);}
.btn-primary{
  width:100%;border:none;cursor:pointer;border-radius:17px;padding:15px 0;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  font-family:inherit;font-size:1rem;font-weight:800;
  box-shadow:0 10px 24px -8px rgba(180,110,160,.7);
}
.btn-primary:active{transform:scale(.98);}
.btn-ghost{
  width:100%;border:none;background:none;color:var(--soft);cursor:pointer;
  font-family:inherit;font-size:.85rem;font-weight:700;padding:13px 0 2px;
}
.btn-ghost:active{color:var(--accent);}

/* Menü-Sheet */
.menu-item{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  border:none;background:none;color:var(--ink);font-family:inherit;font-size:.95rem;font-weight:600;
  padding:14px 4px;cursor:pointer;border-bottom:1px solid var(--line);
}
.menu-item:last-of-type{border-bottom:none;}
.menu-item .ico{width:26px;text-align:center;}
.menu-item .hint{margin-left:auto;font-size:.78rem;color:var(--faint);font-weight:600;}

/* ---------- Konfetti & Toast ---------- */
.confetti{position:fixed;z-index:50;pointer-events:none;width:11px;height:11px;border-radius:3px;}
.toast{
  position:fixed;z-index:60;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%) translateY(16px);
  background:var(--card-solid);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line);
  font-size:.87rem;font-weight:700;padding:13px 21px;border-radius:16px;
  opacity:0;transition:.35s cubic-bezier(.2,1.2,.4,1);white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- Farbwelten ---------- */
body.theme-lavender{--bg1:#efe6fb;--bg2:#e9e6fb;--bg3:#f3e6fb;--blob1:#d4c4f5;--blob2:#f0c0e2;--accent:#a78be5;--accent-2:#e58bc9;--accent-soft:#e6d9f7;}
body.theme-peach{--bg1:#fdeae0;--bg2:#fbe6ec;--bg3:#fdf0e6;--blob1:#f8ceb4;--blob2:#f6bcd0;--accent:#f0a07a;--accent-2:#e58ba9;--accent-soft:#fadfce;}
body.theme-mint{--bg1:#e0f5ec;--bg2:#e6f5f0;--bg3:#e0f0f5;--blob1:#bce8d4;--blob2:#bcdcf0;--accent:#6ec9a8;--accent-2:#8bc9e5;--accent-soft:#cdeee0;}

/* ---------- Desktop / Laptop: zwei Spalten ---------- */
@media (min-width:1000px){
  #app{
    max-width:1100px;
    display:grid;grid-template-columns:440px minmax(0,1fr);gap:28px;align-items:start;
    padding-bottom:60px;
  }
  .header{grid-column:1/-1;}
  .segmented{display:none!important;}
  #listView{display:flex!important;flex-direction:column;gap:16px;min-width:0;}
  #calView{display:block!important;min-width:0;}
  .fab{left:auto;right:44px;bottom:40px;transform:none;}
  .fab:active{transform:scale(.9);}
  .sheet{
    bottom:auto;top:50%;border-radius:26px;max-width:460px;
    transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;
    transition:transform .22s ease, opacity .22s ease;
    box-shadow:0 30px 80px -30px rgba(90,60,110,.5);
  }
  .sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto;}
  .task .body:hover .label{color:var(--accent);}
  .task:hover .del,.task:hover .drag{color:var(--soft);}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <div>
      <div class="hello" id="hello"></div>
      <div class="date" id="date"></div>
      <div class="quote" id="quote"></div>
    </div>

<script>
"use strict";

/* ================= Sound (Web Audio, keine externen Dateien) ================= */
const Sound = (() => {
  let ctx = null;
  function ensure(){
    if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if(ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, start, dur, type, gain){
    const c = ensure(), o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, c.currentTime + start);
    g.gain.setValueAtTime(0, c.currentTime + start);
    g.gain.linearRampToValueAtTime(gain || .16, c.currentTime + start + .015);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + start + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + .02);
  }
  return {
    complete(){ if(!App.state.meta.sound) return;
      tone(660,0,.18,'sine',.14); tone(880,.06,.22,'sine',.16); tone(1174,.13,.4,'sine',.14); tone(1760,.2,.5,'triangle',.05); },
    uncomplete(){ if(!App.state.meta.sound) return; tone(500,0,.12,'sine',.1); tone(360,.05,.16,'sine',.08); },
    add(){ if(!App.state.meta.sound) return; tone(720,0,.09,'triangle',.09); tone(960,.04,.12,'sine',.07); },
    del(){ if(!App.state.meta.sound) return; tone(300,0,.14,'sine',.09); tone(200,.06,.18,'sine',.07); },
    allDone(){ if(!App.state.meta.sound) return;
      [523,659,784,1046,1318].forEach((f,i)=>tone(f,i*.09,.35,'sine',.13)); tone(1568,.5,.6,'triangle',.06); }
  };
})();

/* ================= App (State + render) ================= */
const KEY = 'bloom_v1';
const THEMES = [ ['','Rosé'], ['theme-lavender','Lavendel'], ['theme-peach','Peach'], ['theme-mint','Mint'] ];
const ICONS = ['🌸','⏰','📚','💼','🏋️','🛒','🍽','🌙'];
const DEFAULT_ROUTINES = [
  { id:'r_wake',  text:'Aufwachen!',     icon:'⏰', time:'08:00' },
  { id:'r_sleep', text:'Schlafen gehen', icon:'🌙', time:'22:00' }
];
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const WD_LONG = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MONTHS = ['Jan','Feb','März','Apr','Mai','Juni','Juli','Aug','Sept','Okt','Nov','Dez'];

const App = {
  state: {
    todos: [],                     // {id, text, note, prio, done, created, date:'YYYY-MM-DD'|'', time:'HH:MM'|'', end:'HH:MM'|''}
    meta: { streak:0, lastDone:'', sound:true, theme:0, name:'Sophia',
            routines: DEFAULT_ROUTINES.map(r=>Object.assign({},r)), routineDone:{} },
    filter: 'all',
    view: 'list',
    selDate: '',                   // ausgewählter Tag im Kalender
    editId: null,
    editRoutineId: null,
    newPrio: 0,
    newIcon: '🌸',
    selHour: null,
    selMin: 0,
    newDur: 0
  },

  /* ---------- Persistenz ---------- */
  load(){
    try{
      const raw = JSON.parse(localStorage.getItem(KEY) || '{}');
      if(Array.isArray(raw.todos)) this.state.todos = raw.todos;
      if(raw.meta) this.state.meta = Object.assign(this.state.meta, raw.meta);
    }catch(e){ /* korrupte Daten ignorieren, frisch starten */ }
    // Sortier-Reihenfolge für Bestandsdaten nachrüsten
    this.state.todos.forEach((t,i)=>{ if(typeof t.ord !== 'number') t.ord = i; });
  },
  save(){
    localStorage.setItem(KEY, JSON.stringify({ todos:this.state.todos, meta:this.state.meta }));
  },

  /* ---------- Datum-Helfer ---------- */
  fmtDate(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  },
  parseDate(s){
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
  },
  niceDate(s){
    const d = this.parseDate(s);
    return d.getDate()+'. '+MONTHS[d.getMonth()];
  },

  /* ---------- Ansicht ---------- */
  setView(v){
    this.state.view = v;
    document.getElementById('segList').classList.toggle('active', v==='list');
    document.getElementById('segCal').classList.toggle('active', v==='cal');
    document.getElementById('listView').style.display = v==='list' ? 'contents' : 'none';
    document.getElementById('calView').style.display = v==='cal' ? 'block' : 'none';
    if(v==='cal' && !this.state.selDate) this.state.selDate = this.fmtDate(new Date());
    this.render();
  },
  shiftWeek(dir){
    const d = this.parseDate(this.state.selDate);
    d.setDate(d.getDate() + dir*7);
    this.state.selDate = this.fmtDate(d);
    this.render();
  },
  selectDay(s){
    this.state.selDate = s;
    this.render();
  },

  /* ---------- Sheet: Neu / Bearbeiten ---------- */
  showRoutineFields(isRoutine){
    ['fNote','fDate','fEnd','fPrio'].forEach(id =>
      document.getElementById(id).style.display = isRoutine ? 'none' : '');
  },
  openAdd(){
    this.state.editId = null;
    this.state.editRoutineId = null;
    this.showRoutineFields(false);
    this.fillSheet({ text:'', note:'', prio:0, icon:'🌸',
      date: (this.state.view==='cal' || this.isDesktop()) ? (this.state.selDate||'') : '', time:'', end:'' });
    document.getElementById('sheetTitle').textContent = 'Neues To-Do';
    document.getElementById('saveBtn').textContent = 'Hinzufügen';
    document.getElementById('sheetDelBtn').style.display = 'none';
    this.openSheet('addSheet');
    setTimeout(()=>document.getElementById('taskInput').focus(), 350);
  },
  openEdit(id){
    if(this._justDragged) return;
    const t = this.state.todos.find(x=>x.id===id);
    if(!t) return;
    this.state.editId = id;
    this.state.editRoutineId = null;
    this.showRoutineFields(false);
    this.fillSheet({ text:t.text, note:t.note||'', prio:t.prio||0, icon:t.icon||'🌸', date:t.date||'', time:t.time||'', end:t.end||'' });
    document.getElementById('sheetTitle').textContent = 'To-Do bearbeiten';
    document.getElementById('saveBtn').textContent = 'Speichern';
    document.getElementById('sheetDelBtn').style.display = 'block';
    this.openSheet('addSheet');
  },
  openRoutine(id){
    if(this._justDragged) return;
    const r = (this.state.meta.routines||[]).find(x=>x.id===id);
    if(!r) return;
    this.state.editId = null;
    this.state.editRoutineId = id;
    this.showRoutineFields(true);
    this.fillSheet({ text:r.text, note:'', prio:0, icon:r.icon, date:'', time:r.time, end:'' });
    document.getElementById('sheetTitle').textContent = 'Routine bearbeiten (gilt für jeden Tag)';
    document.getElementById('saveBtn').textContent = 'Speichern';
    document.getElementById('sheetDelBtn').style.display = 'block';
    this.openSheet('addSheet');
  },
  fillSheet(v){
    document.getElementById('taskInput').value = v.text;
    document.getElementById('noteInput').value = v.note;
    document.getElementById('dateInput').value = v.date;
    if(v.time){
      const p = v.time.split(':');
      this.state.selHour = +p[0]; this.state.selMin = +p[1];
    } else {
      this.state.selHour = null; this.state.selMin = 0;
    }
    this.state.newDur = (v.time && v.end) ? Math.max(0, minutesBetween(v.time, v.end)) : 0;
    this.setPrio(v.prio);
    this.setIcon(v.icon);
    this.buildWheels();
    // Scroll-Positionen setzen, sobald das Sheet aufgebaut ist
    setTimeout(()=>this.syncWheels(false), 60);
    setTimeout(()=>this.syncWheels(false), 400);
  },
  wheelVals(kind){
    if(kind==='h'){ const a=[]; for(let i=0;i<24;i++) a.push(i); return a; }
    if(kind==='m'){
      const a=[]; for(let i=0;i<60;i+=5) a.push(i);
      if(a.indexOf(this.state.selMin)<0){ a.push(this.state.selMin); a.sort((x,y)=>x-y); }
      return a;
    }
    const a=[0,5,10,15,20,30,45,60,90,120,150,180,240,300,360];
    if(a.indexOf(this.state.newDur)<0){ a.push(this.state.newDur); a.sort((x,y)=>x-y); }
    return a;
  },
  buildWheels(){
    const durLabel = d => d===0 ? 'Ohne' : d<60 ? d+'m' : d%60===0 ? (d/60)+'h' : Math.floor(d/60)+'h '+(d%60)+'m';
    const fill = (id, kind, fmt) => {
      document.getElementById(id).innerHTML =
        '<div class="pad"></div>' +
        this.wheelVals(kind).map(v=>'<div class="witem" data-v="'+v+'">'+fmt(v)+'</div>').join('') +
        '<div class="pad"></div>';
    };
    fill('wheelH','h', v=>String(v).padStart(2,'0'));
    fill('wheelM','m', v=>String(v).padStart(2,'0'));
    fill('wheelD','d', durLabel);
  },
  syncWheels(smooth){
    const s = this.state;
    document.getElementById('fEnd').style.display = s.editRoutineId ? 'none' : '';
    document.getElementById('wheels').classList.toggle('disabled', s.selHour===null);
    document.getElementById('noTimeBtn').classList.toggle('active', s.selHour===null);
    const ITEM = 44;
    const setPos = (id, kind, val) => {
      const el = document.getElementById(id);
      const idx = Math.max(0, this.wheelVals(kind).indexOf(val));
      el._sync = true;
      el.scrollTo({top: idx*ITEM, behavior: smooth?'smooth':'auto'});
      const items = el.querySelectorAll('.witem');
      items.forEach((it,j)=>it.classList.toggle('on', j===idx));
      setTimeout(()=>{ el._sync = false; }, 250);
    };
    setPos('wheelH','h', s.selHour===null ? 12 : s.selHour);
    setPos('wheelM','m', s.selMin);
    setPos('wheelD','d', s.newDur);
  },
  toggleNoTime(){
    if(this.state.selHour===null){ this.state.selHour = 12; this.state.selMin = 0; }
    else this.state.selHour = null;
    this.syncWheels(false);
  },
  setIcon(ic){
    this.state.newIcon = ic;
    document.getElementById('iconChips').innerHTML = ICONS.map(i =>
      '<button class="icon-chip'+(i===ic?' active':'')+'" onclick="App.setIcon(\''+i+'\')">'+i+'</button>'
    ).join('');
  },
  setPrio(p){
    this.state.newPrio = p;
    document.getElementById('chipNormal').classList.toggle('active', p===0);
    document.getElementById('chipWichtig').classList.toggle('active', p===1);
  },
  saveTask(){
    const text = document.getElementById('taskInput').value.trim();
    if(!text) return;
    const pickedTime = this.state.selHour===null ? '' :
      String(this.state.selHour).padStart(2,'0')+':'+String(this.state.selMin).padStart(2,'0');
    if(this.state.editRoutineId){
      const r = (this.state.meta.routines||[]).find(x=>x.id===this.state.editRoutineId);
      if(r){
        r.text = text;
        r.icon = this.state.newIcon;
        r.time = pickedTime || r.time;
      }
      this.save(); this.closeSheets(); this.render(); toast('Routine gespeichert ✔');
      return;
    }
    const note = document.getElementById('noteInput').value.trim();
    const date = document.getElementById('dateInput').value || '';
    const time = pickedTime;
    const end = (time && this.state.newDur) ? toHM(toMin(time) + this.state.newDur) : '';
    if(this.state.editId){
      const t = this.state.todos.find(x=>x.id===this.state.editId);
      if(t){ t.text=text; t.note=note; t.prio=this.state.newPrio; t.icon=this.state.newIcon; t.date=date; t.time=time; t.end=end; }
      toast('Gespeichert ✔');
    } else {
      const minOrd = this.state.todos.length ? Math.min.apply(null, this.state.todos.map(t=>t.ord||0)) : 1;
      this.state.todos.unshift({
        id: String(Date.now()) + Math.floor(Math.random()*1000),
        text, note, prio: this.state.newPrio, icon: this.state.newIcon,
        done:false, created: Date.now(), date, time, end, ord: minOrd - 1
      });
      Sound.add();
    }
    this.save();
    this.closeSheets(); this.render();
  },
  removeFromSheet(){
    if(this.state.editRoutineId){
      const id = this.state.editRoutineId;
      this.state.meta.routines = (this.state.meta.routines||[]).filter(r=>r.id!==id);
      this.state.editRoutineId = null;
      Sound.del();
      this.save(); this.closeSheets(); this.render();
      toast('Routine entfernt – im Menü wiederherstellbar');
      return;
    }
    if(!this.state.editId) return;
    const id = this.state.editId;
    this.closeSheets();
    this.remove(id);
  },
  toggleRoutine(id){
    if(this._justDragged) return;
    const d = this.state.selDate;
    const map = this.state.meta.routineDone || (this.state.meta.routineDone = {});
    const arr = map[d] || (map[d] = []);
    const i = arr.indexOf(id);
    if(i >= 0){
      arr.splice(i,1);
      Sound.uncomplete();
    } else {
      arr.push(id);
      Sound.complete();
      const el = document.querySelector('[data-id="'+id+'"]');
      if(el) burst(el);
      this.updateStreak();
    }
    this.save(); this.render();
  },
  resetRoutines(){
    this.state.meta.routines = DEFAULT_ROUTINES.map(r=>Object.assign({},r));
    this.save(); this.closeSheets(); this.render();
    toast('Routinen wiederhergestellt ↻');
  },
  applyOrder(ids){
    const items = ids.map(id=>this.state.todos.find(t=>t.id===id)).filter(Boolean);
    const ords = items.map(t=>t.ord||0).sort((a,b)=>a-b);
    items.forEach((t,i)=>{ t.ord = ords[i]; });
    this.save(); this.render();
  },

  /* ---------- Aktionen ---------- */
  toggle(id){
    if(this._justDragged) return;
    const t = this.state.todos.find(x=>x.id===id);
    if(!t) return;
    t.done = !t.done;
    if(t.done){
      Sound.complete();
      const el = document.querySelector('[data-id="'+id+'"]');
      if(el) burst(el);
      this.updateStreak();
      if(this.state.todos.length && this.state.todos.every(x=>x.done)){
        setTimeout(()=>{ Sound.allDone(); rain(); toast('Alles erledigt. Stark durchgezogen 🔥'); }, 350);
      }
    } else {
      Sound.uncomplete();
    }
    this.save(); this.render();
  },
  remove(id){
    Sound.del();
    const el = document.querySelector('[data-id="'+id+'"]');
    if(el) el.classList.add('removing');
    setTimeout(()=>{
      this.state.todos = this.state.todos.filter(x=>x.id!==id);
      this.save(); this.render();
    }, 240);
  },
  clearDone(){
    if(!this.state.todos.some(t=>t.done)) return;
    Sound.del();
    this.state.todos = this.state.todos.filter(t=>!t.done);
    this.save(); this.render(); toast('Aufgeräumt 🧹');
  },
  setFilter(f){ this.state.filter = f; this.render(); },

  /* ---------- Streak ---------- */
  dayStr(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); },
  updateStreak(){
    const today = this.dayStr(new Date());
    if(this.state.meta.lastDone === today) return;
    const y = new Date(); y.setDate(y.getDate()-1);
    this.state.meta.streak = (this.state.meta.lastDone === this.dayStr(y)) ? (this.state.meta.streak||0)+1 : 1;
    this.state.meta.lastDone = today;
    this.save();
  },

  /* ---------- Sheets ---------- */
  openSheet(id){
    document.getElementById('overlay').classList.add('open');
    document.getElementById(id).classList.add('open');
  },
  closeSheets(){
    document.getElementById('overlay').classList.remove('open');
    document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open'));
  },
  openMenu(){ this.openSheet('menuSheet'); },

  /* ---------- Menü ---------- */
  openName(){
    document.getElementById('nameInput').value = this.state.meta.name || '';
    this.openSheet('nameSheet');
    setTimeout(()=>document.getElementById('nameInput').focus(), 350);
  },
  saveName(){
    this.state.meta.name = document.getElementById('nameInput').value.trim().slice(0,20);
    this.save(); this.closeSheets(); this.renderHeader(); this.renderNameUI();
  },
  renderNameUI(){
    document.getElementById('nameHint').textContent = this.state.meta.name || '–';
  },
  cycleTheme(){
    this.state.meta.theme = (this.state.meta.theme + 1) % THEMES.length;
    this.save(); this.applyTheme(); Sound.add();
  },
  applyTheme(){
    // nur eigene Theme-Klassen anfassen, sonst nichts am <body> ändern
    THEMES.forEach(([cls]) => { if(cls) document.body.classList.remove(cls); });
    const [cls, name] = THEMES[this.state.meta.theme] || THEMES[0];
    if(cls) document.body.classList.add(cls);
    document.getElementById('themeHint').textContent = name;
  },
  toggleSound(){
    this.state.meta.sound = !this.state.meta.sound;
    this.save(); this.renderSoundUI();
    if(this.state.meta.sound) Sound.add();
  },
  renderSoundUI(){
    const on = this.state.meta.sound;
    document.getElementById('soundIco').textContent = on ? '🔊' : '🔇';
    document.getElementById('soundHint').textContent = on ? 'an' : 'aus';
  },
  exportData(){
    const blob = new Blob([JSON.stringify({ todos:this.state.todos, meta:this.state.meta }, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'bloom-backup.json';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('Backup exportiert 📤');
  },
  importData(ev){
    const file = ev.target.files && ev.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(!Array.isArray(data.todos)) throw new Error('bad');
        this.state.todos = data.todos;
        if(data.meta) this.state.meta = Object.assign(this.state.meta, data.meta);
        this.save(); this.closeSheets(); this.applyTheme(); this.renderHeader(); this.render();
        toast('Backup importiert 📥');
      }catch(e){ toast('Datei konnte nicht gelesen werden 😕'); }
      ev.target.value = '';
    };
    reader.readAsText(file);
  },

  /* ---------- Task-Zeile (für beide Ansichten) ---------- */
  taskHtml(t, showWhen){
    const chips = [];
    if(t.prio===1 && !t.done) chips.push('<span class="mchip prio">💗 Wichtig</span>');
    if(showWhen && (t.date || t.time)){
      const parts = [];
      if(t.date) parts.push(this.niceDate(t.date));
      if(t.time) parts.push(t.time + (t.end ? '–'+t.end : ''));
      chips.push('<span class="mchip when">🕐 '+parts.join(' · ')+'</span>');
    }
    return '<div class="task'+(t.done?' done':'')+'" data-id="'+t.id+'">'+
      '<button class="check" onclick="App.toggle(\''+t.id+'\')" aria-label="Abhaken">'+
        '<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6"/></svg>'+
      '</button>'+
      '<div class="body" onclick="App.openEdit(\''+t.id+'\')">'+
        '<div class="label">'+esc(t.text)+'</div>'+
        (t.note ? '<div class="note">'+esc(t.note)+'</div>' : '')+
        (chips.length ? '<div class="chips-row">'+chips.join('')+'</div>' : '')+
      '</div>'+
      '<button class="drag" aria-label="Verschieben">⠿</button>'+
      '<button class="del" onclick="App.remove(\''+t.id+'\')" aria-label="Löschen">✕</button>'+
    '</div>';
  },

  /* ---------- Render ---------- */
  isDesktop(){ return window.matchMedia('(min-width:1000px)').matches; },
  render(){
    if(this.isDesktop()){
      // Laptop/PC: Aufgaben und Kalender nebeneinander, beides rendern
      if(!this.state.selDate) this.state.selDate = this.fmtDate(new Date());
      this.renderList();
      this.renderCal();
    } else if(this.state.view === 'cal'){
      this.renderCal();
    } else {
      this.renderList();
    }
    this.renderSoundUI();
    this.renderNameUI();
  },

  renderList(){
    const s = this.state;

    const tabs = [ ['all','Alle'], ['active','Offen'], ['done','Erledigt'] ];
    document.getElementById('tabs').innerHTML = tabs.map(([f,label]) =>
      '<button class="tab'+(s.filter===f?' active':'')+'" onclick="App.setFilter(\''+f+'\')">'+label+'</button>'
    ).join('');

    const filtered = s.todos
      .filter(t => s.filter==='all' ? true : s.filter==='active' ? !t.done : t.done)
      .slice()
      .sort((a,b) => (a.done - b.done) || ((a.ord||0) - (b.ord||0)));

    if(filtered.length === 0){
      const msg = s.filter==='done' ? 'Noch nichts erledigt – fang an.'
                : s.filter==='active' ? 'Alles erledigt. Sauber durchgezogen.'
                : 'Noch nichts geplant.<br>Tipp unten auf +';
      document.getElementById('list').innerHTML =
        '<div class="empty"><span class="em">'+(s.filter==='active'?'🎉':'🌿')+'</span>'+msg+'</div>';
    } else {
      document.getElementById('list').innerHTML = filtered.map(t => this.taskHtml(t, true)).join('');
    }

    const total = s.todos.length, done = s.todos.filter(t=>t.done).length;
    const pct = total ? Math.round(done/total*100) : 0;
    document.getElementById('pct').textContent = pct+'%';
    document.getElementById('ringFill').style.strokeDashoffset = 214 - 214*pct/100;
    const big = document.getElementById('pBig'), small = document.getElementById('pSmall');
    if(total === 0){ big.textContent = "Los geht's"; small.textContent = 'Noch nichts geplant'; }
    else if(done === total){ big.textContent = 'Alles erledigt 🎉'; small.textContent = 'Nichts mehr offen. Respekt.'; }
    else { big.textContent = done+' von '+total+' geschafft'; small.textContent = (total-done)+' noch offen'; }
    document.getElementById('streakNum').textContent = s.meta.streak || 0;
    document.getElementById('count').textContent = s.todos.filter(t=>!t.done).length + ' offen';
  },

  renderCal(){
    const s = this.state;
    if(!s.selDate) s.selDate = this.fmtDate(new Date());
    const sel = this.parseDate(s.selDate);
    const today = this.fmtDate(new Date());

    // Montag der ausgewählten Woche finden
    const monday = new Date(sel);
    monday.setDate(sel.getDate() - ((sel.getDay()+6)%7));

    document.getElementById('calLabel').textContent =
      monday.getDate()+'. '+MONTHS[monday.getMonth()]+' – ' +
      (()=>{ const su=new Date(monday); su.setDate(monday.getDate()+6);
             return su.getDate()+'. '+MONTHS[su.getMonth()]; })();

    let strip = '';
    for(let i=0;i<7;i++){
      const d = new Date(monday); d.setDate(monday.getDate()+i);
      const ds = this.fmtDate(d);
      const has = s.todos.some(t=>t.date===ds && !t.done);
      strip += '<button class="day'+(ds===s.selDate?' sel':'')+(ds===today?' today':'')+(has?' has':'')+'" '+
        'onclick="App.selectDay(\''+ds+'\')">'+
        '<span class="wd">'+WD[d.getDay()]+'</span>'+
        '<span class="num">'+d.getDate()+'</span>'+
        '<span class="dot"></span>'+
      '</button>';
    }
    document.getElementById('week').innerHTML = strip;

    document.getElementById('dayTitle').textContent =
      WD_LONG[sel.getDay()]+', '+sel.getDate()+'. '+MONTHS[sel.getMonth()] + (s.selDate===today ? ' · Heute' : '');

    const dayTasks = s.todos.filter(t => t.date === s.selDate);
    const untimed = dayTasks.filter(t => !t.time)
      .sort((a,b) => (a.done - b.done) || ((a.ord||0) - (b.ord||0)));
    const doneRoutines = (s.meta.routineDone||{})[s.selDate] || [];
    const routines = (s.meta.routines||[]).map(r => ({
      id:r.id, text:r.text, icon:r.icon, time:r.time, end:'', note:'', prio:0,
      done: doneRoutines.indexOf(r.id) >= 0, routine:true
    }));
    const timed = dayTasks.filter(t => t.time)
      .concat(routines)
      .sort((a,b) => a.time < b.time ? -1 : a.time > b.time ? 1 : 0);

    let html = '';
    if(untimed.length){
      html += '<div class="day-sub">Ohne Uhrzeit</div>' + untimed.map(t => this.taskHtml(t, false)).join('');
    }
    if(timed.length){
      const now = new Date();
      const isToday = s.selDate === this.fmtDate(now);
      const nowHM = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
      const nowRow = '<div class="tlx-now"><span class="t">'+nowHM+'</span><span class="ln"></span></div>';
      let nowInserted = !isToday;
      let rows = '';

      for(let i=0;i<timed.length;i++){
        const t = timed[i];
        if(!nowInserted && nowHM < t.time){ rows += nowRow; nowInserted = true; }
        // freies Fenster zwischen zwei Terminen anzeigen
        if(i > 0){
          const from = timed[i-1].end || timed[i-1].time;
          const g = minutesBetween(from, t.time);
          if(g >= 45){
            rows += '<div class="tlx-gap"><div class="sp"></div><div class="rail"></div>'+
              '<div class="msg">🕐 Ein Fenster: <b>'+fmtDur(g)+'</b> frei</div></div>';
          }
        }
        let sub = t.time + (t.end ? ' – '+t.end : '');
        let subCls = '';
        if(t.routine) sub += ' ↻';
        if(isToday && !t.done && t.end && t.time <= nowHM && nowHM < t.end){
          sub = 'Noch '+fmtDur(minutesBetween(nowHM, t.end));
          subCls = ' now';
        }
        if(t.prio===1 && !t.done) sub += ' · 💗 Wichtig';
        const editFn = t.routine ? 'App.openRoutine' : 'App.openEdit';
        const checkFn = t.routine ? 'App.toggleRoutine' : 'App.toggle';
        rows += '<div class="tlx-row'+(t.done?' done':'')+'" data-id="'+t.id+'">'+
          '<div class="tlx-time">'+
            '<span class="t1">'+t.time+'</span>'+
            (t.end ? '<span class="t2">'+t.end+'</span>' : '')+
          '</div>'+
          '<div class="tlx-rail"><div class="tlx-bubble'+(t.end?' pill':'')+'">'+(t.icon||'🌸')+'</div></div>'+
          '<div class="tlx-body">'+
            '<div class="tlx-info" onclick="'+editFn+'(\''+t.id+'\')">'+
              '<div class="tlx-sub'+subCls+'">'+sub+'</div>'+
              '<div class="tlx-title">'+esc(t.text)+'</div>'+
              (t.note ? '<div class="tlx-note">'+esc(t.note)+'</div>' : '')+
            '</div>'+
            '<button class="tlx-check" onclick="'+checkFn+'(\''+t.id+'\')" aria-label="Abhaken">'+
              '<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6"/></svg>'+
            '</button>'+
          '</div>'+
        '</div>';
      }
      if(!nowInserted) rows += nowRow;
      html += '<div class="panel">'+rows+'</div>';
    }
    document.getElementById('dayList').innerHTML = html ||
      '<div class="empty"><span class="em">🗓</span>Nichts geplant an diesem Tag.<br>Tipp unten auf + zum Planen.</div>';
  },

  renderHeader(){
    const d = new Date();
    const h = d.getHours();
    const name = this.state.meta.name;
    const withName = txt => name ? txt + ', ' + name : txt;

    document.getElementById('hello').textContent =
      h<11 ? withName('Good morning') : h<17 ? withName('Good afternoon') : withName('Good evening');
    document.getElementById('date').innerHTML =
      WD_LONG[d.getDay()]+', <b>'+d.getDate()+'. '+MONTHS[d.getMonth()]+'</b>';

    // Sprüche je nach Tageszeit – direkt, nicht kitschig
    const morning = [
      'Win the first hour. The rest will follow.',
      'Start before you feel ready.',
      'Discipline beats motivation. Show up.',
      'One focused hour beats a scattered day.',
      withName('Set the tone early') + '.'
    ];
    const afternoon = [
      withName('Afternoon wins coming your way') + '.',
      'Push yourself — no one else is going to do it for you.',
      'Done is better than perfect. Keep moving.',
      'Consistency is a form of self-respect.',
      'Nobody is coming to save your to-do list.'
    ];
    const evening = [
      'Finish strong. Future you is watching.',
      'One more win before you close the day.',
      'What you do daily becomes who you are.',
      'Rest is earned. Almost there.',
      withName('End the day on your terms') + '.'
    ];
    const pool = h<11 ? morning : h<17 ? afternoon : evening;
    document.getElementById('quote').textContent = pool[d.getDate() % pool.length];
  },

  init(){
    this.load();
    this.applyTheme();
    this.renderHeader();
    this.render();
    // "Jetzt"-Linie und Restzeit-Anzeige minütlich aktualisieren
    setInterval(()=>{ this.renderHeader(); if(this.state.view==='cal') this.render(); }, 60000);
    setupDrag(document.getElementById('list'));
    setupDrag(document.getElementById('dayList'));
    setupTimeDrag(document.getElementById('dayList'));
    // Wheel-Scrollen: nach kurzem Stillstand einrasten und Wert übernehmen
    const ITEM = 44;
    [['wheelH','h'],['wheelM','m'],['wheelD','d']].forEach(([id,kind])=>{
      const el = document.getElementById(id);
      let t = null;
      el.addEventListener('scroll', ()=>{
        if(el._sync) return;
        clearTimeout(t);
        t = setTimeout(()=>{
          const items = el.querySelectorAll('.witem');
          if(!items.length) return;
          const idx = Math.max(0, Math.min(items.length-1, Math.round(el.scrollTop/ITEM)));
          const v = +items[idx].dataset.v;
          if(kind==='h') this.state.selHour = v;
          else if(kind==='m') this.state.selMin = v;
          else this.state.newDur = v;
          items.forEach((it,j)=>it.classList.toggle('on', j===idx));
          if(Math.abs(el.scrollTop - idx*ITEM) > 2){
            el._sync = true;
            el.scrollTo({top: idx*ITEM, behavior:'smooth'});
            setTimeout(()=>{ el._sync = false; }, 250);
          }
        }, 120);
      }, {passive:true});
    });
    // Beim Wechsel Handy-/Desktop-Breite das Layout neu aufbauen
    window.matchMedia('(min-width:1000px)').addEventListener('change', ()=>{
      this.setView(this.state.view);
    });
  }
};

/* Aufgaben per Ziehen am ⠿-Griff umsortieren (Touch + Maus) */
function setupDrag(container){
  let row = null, moved = false;
  const rows = () => Array.prototype.slice.call(container.querySelectorAll('.task[data-id]'));

  function start(target){
    const h = target.closest ? target.closest('.drag') : null;
    if(!h) return false;
    row = h.closest('.task');
    moved = false;
    if(row) row.classList.add('dragging');
    return !!row;
  }
  function move(y){
    if(!row) return;
    moved = true;
    const others = rows().filter(r => r !== row);
    for(const r of others){
      const rect = r.getBoundingClientRect();
      if(y > rect.top && y < rect.top + rect.height/2){ container.insertBefore(row, r); break; }
      if(y >= rect.top + rect.height/2 && y < rect.bottom){ container.insertBefore(row, r.nextSibling); break; }
    }
  }
  function end(){
    if(!row) return;
    row.classList.remove('dragging');
    if(moved) App.applyOrder(rows().map(r => r.dataset.id));
    row = null;
  }

  container.addEventListener('touchstart', e => { if(start(e.target)) e.preventDefault(); }, {passive:false});
  container.addEventListener('touchmove', e => { if(row){ e.preventDefault(); move(e.touches[0].clientY); } }, {passive:false});
  container.addEventListener('touchend', end);
  container.addEventListener('touchcancel', end);
  container.addEventListener('mousedown', e => { if(start(e.target)) e.preventDefault(); });
  document.addEventListener('mousemove', e => { if(row) move(e.clientY); });
  document.addEventListener('mouseup', end);
}

function minutesBetween(a, b){
  const [h1,m1] = a.split(':').map(Number), [h2,m2] = b.split(':').map(Number);
  return (h2*60+m2) - (h1*60+m1);
}
function toMin(s){
  const [h,m] = s.split(':').map(Number);
  return h*60 + m;
}
function toHM(min){
  min = Math.max(0, Math.min(23*60+55, min));
  min = Math.round(min/5)*5;
  return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0');
}

/* Zeitstrahl: Termin gedrückt halten und ziehen → folgt dem Finger,
   die Uhrzeit läuft live mit (5-Minuten-Raster) und wird beim Loslassen übernommen */
function setupTimeDrag(container){
  const MIN_PER_PX = 0.8;   // 100px ziehen ≈ 80 Minuten
  const EDGE = 130;         // Randzone in px: dort läuft die Zeit automatisch weiter
  const EDGE_SPEED = 2.2;   // max. Minuten pro Frame in der Randzone (~130 min/s)
  let row=null, item=null, timer=null, startY=0, lastY=0, active=false;
  let origMin=0, dur=0, newMin=0, edge=0, raf=null, origTop=0, rowH=0;

  const findItem = id =>
    App.state.todos.find(t=>t.id===id) || (App.state.meta.routines||[]).find(r=>r.id===id);
  const clearTimer = () => { if(timer){ clearTimeout(timer); timer=null; } };

  function begin(target, y){
    const r = target.closest ? target.closest('.tlx-row') : null;
    if(!r || (target.closest && target.closest('.tlx-check'))) return;
    row = r; startY = y; lastY = y; active = false;
    timer = setTimeout(()=>{
      item = findItem(row.dataset.id);
      if(!item || !item.time){ row = null; return; }
      active = true;
      origMin = toMin(item.time);
      dur = item.end ? minutesBetween(item.time, item.end) : 0;
      newMin = origMin;
      edge = 0;
      const rect = row.getBoundingClientRect();
      origTop = rect.top; rowH = rect.height;
      row.classList.add('dragging');
      raf = requestAnimationFrame(step);
    }, 300);
  }
  function step(){
    if(!row || !active){ raf = null; return; }
    const vh = window.innerHeight;

    // Randzone: Finger oben/unten halten lässt die Zeit weiterlaufen
    if(lastY < EDGE) edge -= ((EDGE - lastY) / EDGE) * EDGE_SPEED;
    else if(lastY > vh - EDGE) edge += ((lastY - (vh - EDGE)) / EDGE) * EDGE_SPEED;

    const dy = lastY - startY;
    let m = Math.round((origMin + dy*MIN_PER_PX + edge)/5)*5;
    m = Math.max(0, Math.min(23*60+55 - dur, m));
    if(m !== newMin){
      newMin = m;
      const t1 = row.querySelector('.t1'), t2 = row.querySelector('.t2'), sub = row.querySelector('.tlx-sub');
      if(t1) t1.textContent = toHM(m);
      if(t2) t2.textContent = toHM(m + dur);
      if(sub) sub.textContent = toHM(m) + (dur ? ' – '+toHM(m + dur) : '') + (item.id && String(item.id).indexOf('r_')===0 ? ' ↻' : '');
    }

    // Sichtbar am Finger folgen, aber im Bildschirm bleiben
    let vis = dy;
    const minVis = 70 - origTop;
    const maxVis = (vh - 100) - (origTop + rowH);
    vis = Math.max(minVis, Math.min(maxVis, vis));
    row.style.transform = 'translateY('+vis+'px) scale(1.015)';

    raf = requestAnimationFrame(step);
  }
  function move(y){ lastY = y; }
  function finish(){
    clearTimer();
    if(raf){ cancelAnimationFrame(raf); raf = null; }
    if(row && active){
      row.classList.remove('dragging');
      row.style.transform = '';
      App._justDragged = true;
      setTimeout(()=>{ App._justDragged = false; }, 400);
      if(newMin !== origMin){
        item.time = toHM(newMin);
        if(dur) item.end = toHM(newMin + dur);
        App.save(); App.render();
        toast('Verschoben auf '+item.time+' 🕐');
      }
    }
    row = null; item = null; active = false;
  }

  container.addEventListener('touchstart', e => begin(e.target, e.touches[0].clientY), {passive:true});
  container.addEventListener('touchmove', e => {
    if(!row) return;
    const y = e.touches[0].clientY;
    if(!active){
      if(Math.abs(y - startY) > 10){ clearTimer(); row = null; }  // User scrollt nur
      return;
    }
    e.preventDefault();
    move(y);
  }, {passive:false});
  container.addEventListener('touchend', finish);
  container.addEventListener('touchcancel', finish);
  container.addEventListener('mousedown', e => begin(e.target, e.clientY));
  document.addEventListener('mousemove', e => {
    if(!row) return;
    if(!active && Math.abs(e.clientY - startY) > 8) return;
    move(e.clientY);
  });
  document.addEventListener('mouseup', finish);
}
function fmtDur(min){
  const h = Math.floor(min/60), m = min%60;
  return (h ? h+'h' : '') + (h && m ? ' ' : '') + (m || !h ? m+'min' : '');
}

/* ================= Helfer ================= */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2500);
}

/* Konfetti-Burst an einem Element */
function burst(el){
  const r = el.getBoundingClientRect();
  const x = r.left + 34, y = r.top + r.height/2;
  const colors = ['#e58ba9','#b48be5','#f6bcd0','#8bc9e5','#ffd6a5','#c4b5f7'];
  for(let i=0;i<14;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.background = colors[i % colors.length];
    c.style.left = x+'px'; c.style.top = y+'px';
    if(i % 3 === 0) c.style.borderRadius = '50%';
    document.body.appendChild(c);
    const ang = Math.random()*Math.PI*2, dist = 40 + Math.random()*70;
    c.animate([
      {transform:'translate(0,0) rotate(0) scale(1)', opacity:1},
      {transform:'translate('+(Math.cos(ang)*dist)+'px,'+(Math.sin(ang)*dist-30)+'px) rotate('+(Math.random()*540)+'deg) scale(.3)', opacity:0}
    ],{duration:700+Math.random()*400, easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish = ()=>c.remove();
  }
}

/* Konfetti-Regen, wenn alles fertig ist */
function rain(){
  const colors = ['#e58ba9','#b48be5','#f6bcd0','#8bc9e5','#ffd6a5','#c4b5f7','#a0e5c9'];
  for(let i=0;i<60;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.background = colors[i % colors.length];
    c.style.left = Math.random()*window.innerWidth+'px';
    c.style.top = '-20px';
    if(i % 2 === 0) c.style.borderRadius = '50%';
    document.body.appendChild(c);
    c.animate([
      {transform:'translate(0,0) rotate(0)', opacity:1},
      {transform:'translate('+((Math.random()-.5)*200)+'px,'+(window.innerHeight+40)+'px) rotate('+(Math.random()*720)+'deg)', opacity:1, offset:.9},
      {opacity:0}
    ],{duration:2200+Math.random()*1200, easing:'cubic-bezier(.3,.6,.5,1)'}).onfinish = ()=>c.remove();
  }
}
